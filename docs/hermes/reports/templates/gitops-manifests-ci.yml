name: gitops-manifests-ci

on:
  pull_request:
    paths:
      - "clusters/**"
      - "apps/**"
      - "charts/**"
      - ".github/workflows/gitops-manifests-ci.yml"
  push:
    branches: [main]
    paths:
      - "clusters/**"
      - "apps/**"
      - "charts/**"
      - ".github/workflows/gitops-manifests-ci.yml"

permissions:
  contents: read

concurrency:
  group: gitops-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBERNETES_VERSION: "1.36.1"
  KUSTOMIZE_VERSION: "5.8.1"
  KUBECONFORM_VERSION: "0.7.0"
  GITLEAKS_VERSION: "8.30.1"
  HELM_VERSION: "4.2.0"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Run actionlint
        run: actionlint

  lint-and-validate:
    name: Lint, render, validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python YAML tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install yamllint==1.38.0

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o /tmp/kustomize.tgz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install helm
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Secret scan
        run: |
          gitleaks detect --source . --redact --no-banner --verbose

      - name: YAML lint
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for p in clusters apps charts .github/workflows; do
            [ -e "$p" ] && paths+=("$p")
          done
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No YAML paths found; skipping yamllint."
          else
            yamllint -d '{extends: default, rules: {line-length: disable, truthy: disable}}' "${paths[@]}"
          fi

      - name: Render kustomize overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          found=0
          while IFS= read -r -d '' kfile; do
            dir="$(dirname "$kfile")"
            out="/tmp/rendered/$(echo "$dir" | tr '/ ' '__').yaml"
            echo "Rendering $dir -> $out"
            kustomize build "$dir" > "$out"
            found=1
          done < <(find clusters apps -name kustomization.yaml -print0 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo "No kustomization.yaml found under clusters/ or apps/; skipping render."
          fi

      - name: Validate rendered Kubernetes manifests
        run: |
          set -euo pipefail
          if compgen -G "/tmp/rendered/*.yaml" > /dev/null; then
            kubeconform \
              -strict \
              -summary \
              -ignore-missing-schemas \
              -kubernetes-version "${KUBERNETES_VERSION}" \
              /tmp/rendered/*.yaml
          else
            echo "No rendered manifests to validate."
          fi

      - name: Helm template charts if present
        run: |
          set -euo pipefail
          if [ -d charts ]; then
            for chart in charts/*; do
              [ -f "$chart/Chart.yaml" ] || continue
              echo "Templating $chart"
              helm template "$(basename "$chart")" "$chart" > "/tmp/rendered/helm-$(basename "$chart").yaml"
            done
          fi

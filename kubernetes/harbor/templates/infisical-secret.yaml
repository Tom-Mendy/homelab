{{- if .Values.infisicalSecret.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.infisicalSecret.serviceAccountName }}
  namespace: {{ .Values.namespace }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: {{ .Values.infisicalSecret.connectionName }}
  namespace: {{ .Values.namespace }}
spec:
  address: {{ .Values.infisicalSecret.address | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.infisicalSecret.identitySecretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  identityId: {{ .Values.infisicalSecret.identityID | quote }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: {{ .Values.infisicalSecret.authName }}
  namespace: {{ .Values.namespace }}
spec:
  method: kubernetes
  infisicalConnectionRef:
    name: {{ .Values.infisicalSecret.connectionName }}
    namespace: {{ .Values.namespace }}
  kubernetes:
    identityIdRef:
      name: {{ .Values.infisicalSecret.identitySecretName }}
      namespace: {{ .Values.namespace }}
      key: identityId
    serviceAccountRef:
      name: {{ .Values.infisicalSecret.serviceAccountName }}
      namespace: {{ .Values.namespace }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.infisicalSecret.name }}
  namespace: {{ .Values.namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisicalSecret.authName }}
    namespace: {{ .Values.namespace }}
  sources:
    - projectId: {{ .Values.infisicalSecret.projectId | quote }}
      environmentSlug: {{ .Values.infisicalSecret.envSlug | quote }}
      secretPath: {{ .Values.infisicalSecret.secretsPath | quote }}
      recursive: false
  targets:
    - name: {{ .Values.infisicalSecret.name }}
      namespace: {{ .Values.namespace }}
      kind: Secret
      creationPolicy: Orphan
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          HARBOR_ADMIN_PASSWORD: "{{ `{{ .HARBOR_ADMIN_PASSWORD.Value }}` }}"
          secretKey: "{{ `{{ .HARBOR_SECRET_KEY.Value }}` }}"
          secret: "{{ `{{ .HARBOR_CORE_SECRET.Value }}` }}"
          JOBSERVICE_SECRET: "{{ `{{ .HARBOR_JOBSERVICE_SECRET.Value }}` }}"
          REGISTRY_HTTP_SECRET: "{{ `{{ .HARBOR_REGISTRY_SECRET.Value }}` }}"
          REGISTRY_PASSWD: "{{ `{{ .HARBOR_REGISTRY_PASSWORD.Value }}` }}"
          REGISTRY_HTPASSWD: "{{ `{{ .HARBOR_REGISTRY_HTPASSWD.Value }}` }}"
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false
{{- end }}
{{- if .Values.proxyCredentials.enabled }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: harbor-proxy-credentials
  namespace: {{ .Values.namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisicalSecret.authName }}
    namespace: {{ .Values.namespace }}
  sources:
    - projectId: {{ .Values.infisicalSecret.projectId | quote }}
      environmentSlug: {{ .Values.infisicalSecret.envSlug | quote }}
      secretPath: {{ .Values.proxyCredentials.secretsPath | quote }}
      recursive: false
  targets:
    - name: {{ .Values.proxyCredentials.name }}
      namespace: {{ .Values.namespace }}
      kind: Secret
      creationPolicy: Orphan
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          DOCKERHUB_USERNAME: "{{ `{{ .DOCKERHUB_USERNAME.Value }}` }}"
          DOCKERHUB_PASSWORD: "{{ `{{ .DOCKERHUB_PASSWORD.Value }}` }}"
          GHCR_USERNAME: "{{ `{{ .GHCR_USERNAME.Value }}` }}"
          GHCR_PASSWORD: "{{ `{{ .GHCR_PASSWORD.Value }}` }}"
          QUAY_USERNAME: "{{ `{{ .QUAY_USERNAME.Value }}` }}"
          QUAY_PASSWORD: "{{ `{{ .QUAY_PASSWORD.Value }}` }}"
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false
{{- end }}

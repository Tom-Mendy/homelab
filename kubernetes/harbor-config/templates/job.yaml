apiVersion: batch/v1
kind: Job
metadata:
  name: harbor-config
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-config
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: [python3, /config/configure.py]
          env:
            - name: HARBOR_URL
              value: {{ .Values.harbor.url | quote }}
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.harbor.adminSecretName }}
                  key: {{ .Values.harbor.adminSecretKey }}
            - name: HARBOR_PROXY_PROJECTS
              value: {{ .Values.projects | toJson | quote }}
{{- range $project := .Values.projects }}
{{- if $project.usernameKey }}
            - name: {{ $project.usernameKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.harbor.proxySecretName }}
                  key: {{ $project.usernameKey }}
                  optional: true
            - name: {{ $project.passwordKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.harbor.proxySecretName }}
                  key: {{ $project.passwordKey }}
                  optional: true
{{- end }}
{{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: harbor-config-script

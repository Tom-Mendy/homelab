# keel-values.yaml
keel:
  # keel policy (all/major/minor/patch/force)
  policy: patch

# Disable Helm provider (Keel won't try to upgrade Helm releases itself)
helmProvider:
  enabled: false

# Enable basic authentication for the admin dashboard
basicauth:
  enabled: true
  user: admin
  password: ""

secret:
  create: false
  name: keel

# Enable the Keel service so Traefik can route traffic
service:
  enabled: true

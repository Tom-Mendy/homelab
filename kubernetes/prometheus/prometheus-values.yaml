rbac:
  create: true

scrapeConfigs:
  kubernetes-nodes-cadvisor:
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels:
          - __meta_kubernetes_node_name
        target_label: node
      - source_labels:
          - __metrics_path__
        target_label: metrics_path

alertmanager:
  enabled: false

server:
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
    runAsNonRoot: false
  persistentVolume:
    enabled: true
    existingClaim: prometheus-server-pvc
  service:
    type: ClusterIP

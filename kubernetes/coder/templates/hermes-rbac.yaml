apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: coder-workspaces
  labels:
    app.kubernetes.io/name: hermes-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-admin
  labels:
    app.kubernetes.io/name: hermes-workspace
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: coder-workspaces
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

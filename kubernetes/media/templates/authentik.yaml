apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost
  namespace: {{ .Values.namespace }}
spec:
  type: ExternalName
  externalName: authentik-server.authentik.svc.cluster.local
  ports:
    - name: http
      port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-media
  namespace: {{ .Values.namespace }}
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
{{- range $name := list "radarr" "sonarr" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-authentik-ingress
  namespace: {{ $.Values.namespace }}
  annotations:
{{ toYaml $.Values.ingress.annotations | nindent 4 }}
spec:
  rules:
    - host: {{ index $.Values.apps $name "host" }}
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 80
{{- end }}

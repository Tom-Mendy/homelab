{{- $app := .Values.apps.nzbget }}
{{- if $app.vpn }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbget-nymvpn-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nymVpn.stateStorage.size }}
  storageClassName: {{ .Values.nymVpn.stateStorage.className }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nzbget-config-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default .Values.configStorage.defaultSize $app.configSize }}
  storageClassName: {{ .Values.configStorage.className }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      {{- if $app.vpn }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        - name: nymvpn-state-init
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p /nym/config /nym/state"]
          volumeMounts:
            - name: nymvpn-state
              mountPath: /nym
        - name: nymvpn
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: NYMVPN_ENTRY_COUNTRY
              value: {{ .Values.nymVpn.entryCountry | quote }}
            - name: NYMVPN_EXIT_COUNTRY
              value: {{ .Values.nymVpn.exitCountry | quote }}
            - name: NYMVPN_POD_CIDR
              value: {{ .Values.nymVpn.podCidr | quote }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 3
            periodSeconds: 20
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: nymvpn-state
              mountPath: /etc/nym
              subPath: config
            - name: nymvpn-state
              mountPath: /var/lib/nym-vpnd
              subPath: state
            - name: nymvpn-access-code
              mountPath: /run/secrets/nymvpn
              readOnly: true
      {{- end }}
      containers:
        - name: nzbget
          image: {{ $app.image | quote }}
          env:
            - name: PUID
              value: {{ .Values.securityContext.puid | quote }}
            - name: PGID
              value: {{ .Values.securityContext.pgid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
          ports:
            - containerPort: {{ $app.port }}
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $app.mounts.downloads }}
            - name: downloads
              mountPath: /data/downloads
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nzbget-config-pvc
        {{- if $app.mounts.downloads }}
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads-pvc
        {{- end }}
        {{- if $app.vpn }}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- if $app.vpn }}
        - name: nymvpn-state
          persistentVolumeClaim:
            claimName: nzbget-nymvpn-pvc
        - name: nymvpn-access-code
          secret:
            secretName: {{ .Values.nymVpn.secretName }}
            defaultMode: 0400
            items:
              - key: NYM_ACCESS_CODE
                path: access-code
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: nzbget
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: {{ $app.port }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nzbget-ingress
  namespace: {{ .Values.namespace }}
  annotations:
{{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  rules:
    - host: {{ $app.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nzbget
                port:
                  number: {{ $app.port }}
{{- end }}

{{- $app := .Values.apps.qbittorrent }}
{{- $vpnProvider := default "protonvpn" $app.vpnProvider }}
{{- if and .Values.vpn.enabled $app.vpn (eq $vpnProvider "nymvpn") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-nymvpn-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nymVpn.stateStorage.size }}
  storageClassName: {{ .Values.nymVpn.stateStorage.className }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default .Values.configStorage.defaultSize $app.configSize }}
  storageClassName: {{ .Values.configStorage.className }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: {{ .Values.namespace }}
  annotations:
    keel.sh/policy: all
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      {{- if and .Values.vpn.enabled $app.vpn (eq $vpnProvider "nymvpn") }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        - name: nymvpn-state-init
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p /nym/config /nym/state"]
          volumeMounts:
            - name: nymvpn-state
              mountPath: /nym
        - name: nymvpn
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: NYMVPN_ENTRY_COUNTRY
              value: {{ .Values.nymVpn.entryCountry | quote }}
            - name: NYMVPN_EXIT_COUNTRY
              value: {{ .Values.nymVpn.exitCountry | quote }}
            - name: NYMVPN_POD_CIDR
              value: {{ .Values.nymVpn.podCidr | quote }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 3
            periodSeconds: 20
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: nymvpn-state
              mountPath: /etc/nym
              subPath: config
            - name: nymvpn-state
              mountPath: /var/lib/nym-vpnd
              subPath: state
            - name: nymvpn-access-code
              mountPath: /run/secrets/nymvpn
              readOnly: true
      {{- end }}
      containers:
        {{- if and .Values.vpn.enabled $app.vpn (eq $vpnProvider "protonvpn") }}
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: {{ .Values.vpn.serviceProvider | quote }}
            - name: VPN_TYPE
              value: {{ .Values.vpn.type | quote }}
            {{- if eq (lower .Values.vpn.type) "wireguard" }}
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vpn.secretName }}
                  key: WIREGUARD_PRIVATE_KEY
            {{- else }}
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vpn.secretName }}
                  key: OPENVPN_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vpn.secretName }}
                  key: OPENVPN_PASSWORD
            {{- end }}
            - name: FIREWALL
              value: {{ .Values.vpn.firewall | quote }}
            - name: FIREWALL_INPUT_PORTS
              value: {{ $app.port | quote }}
            - name: SERVER_COUNTRIES
              value: {{ .Values.vpn.serverCountries | quote }}
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
        {{- end }}
        - name: qbittorrent
          image: {{ $app.image | quote }}
          env:
            - name: PUID
              value: {{ .Values.securityContext.puid | quote }}
            - name: PGID
              value: {{ .Values.securityContext.pgid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            {{- with $app.extraEnv }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ $app.port }}
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $app.mounts.downloads }}
            - name: downloads
              mountPath: /data/downloads
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        {{- if $app.mounts.downloads }}
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads-pvc
        {{- end }}
        {{- if and .Values.vpn.enabled $app.vpn (ne $vpnProvider "none") }}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- if and .Values.vpn.enabled $app.vpn (eq $vpnProvider "nymvpn") }}
        - name: nymvpn-state
          persistentVolumeClaim:
            claimName: qbittorrent-nymvpn-pvc
        - name: nymvpn-access-code
          secret:
            secretName: {{ .Values.nymVpn.secretName }}
            defaultMode: 0400
            items:
              - key: NYM_ACCESS_CODE
                path: access-code
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: {{ $app.port }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-ingress
  namespace: {{ .Values.namespace }}
  annotations:
{{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  rules:
    - host: {{ $app.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: {{ $app.port }}
{{- end }}

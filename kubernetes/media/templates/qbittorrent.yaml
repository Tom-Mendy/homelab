{{- $app := .Values.apps.qbittorrent }}
{{- if $app.ssoAuthWhitelist }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-sso
  namespace: {{ .Values.namespace }}
data:
  ensure-sso-auth.sh: |
    #!/bin/bash
    set -e

    CONF=/config/qBittorrent/qBittorrent.conf
    mkdir -p /config/qBittorrent
    touch "$CONF"

    set_key() {
      key="$1"
      value="$2"
      export KEY="$key" VALUE="$value"
      if awk 'index($0, ENVIRON["KEY"] "=") == 1 { found=1; exit } END { exit !found }' "$CONF"; then
        awk 'index($0, ENVIRON["KEY"] "=") == 1 { print ENVIRON["KEY"] "=" ENVIRON["VALUE"]; next } { print }' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"
      elif grep -q '^\[Preferences\]' "$CONF"; then
        awk '
          /^\[/ { if (in_prefs && !inserted) { print ENVIRON["KEY"] "=" ENVIRON["VALUE"]; inserted=1 } in_prefs=0 }
          /^\[Preferences\]/ { in_prefs=1 }
          { print }
          END { if (!inserted) print ENVIRON["KEY"] "=" ENVIRON["VALUE"] }
        ' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"
      else
        printf '\n[Preferences]\n%s=%s\n' "$key" "$value" >> "$CONF"
      fi
    }

    set_key 'WebUI\AuthSubnetWhitelistEnabled' 'true'
    set_key 'WebUI\AuthSubnetWhitelist' "$SSO_AUTH_WHITELIST"
    # qBittorrent must use the proxy address when evaluating the whitelist.
    # Otherwise it can ignore the forwarded client address and keep its own
    # authentication challenge in front of the Authentik session.
    set_key 'WebUI\LocalHostAuth' 'false'
    set_key 'WebUI\ReverseProxySupportEnabled' 'true'
    set_key 'WebUI\TrustedReverseProxiesList' "$SSO_AUTH_WHITELIST"
---
{{- end }}
{{- if $app.vpn }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-nymvpn-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nymVpn.stateStorage.size }}
  storageClassName: {{ .Values.nymVpn.stateStorage.className }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ default .Values.configStorage.defaultSize $app.configSize }}
  storageClassName: {{ .Values.configStorage.className }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      {{- if $app.vpn }}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        - name: nymvpn-state-init
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p /nym/config /nym/state"]
          volumeMounts:
            - name: nymvpn-state
              mountPath: /nym
        - name: nymvpn
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: NYMVPN_ENTRY_COUNTRY
              value: {{ .Values.nymVpn.entryCountry | quote }}
            - name: NYMVPN_EXIT_COUNTRY
              value: {{ .Values.nymVpn.exitCountry | quote }}
            - name: NYMVPN_POD_CIDR
              value: {{ .Values.nymVpn.podCidr | quote }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 3
            periodSeconds: 20
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: nymvpn-state
              mountPath: /etc/nym
              subPath: config
            - name: nymvpn-state
              mountPath: /var/lib/nym-vpnd
              subPath: state
            - name: nymvpn-access-code
              mountPath: /run/secrets/nymvpn
              readOnly: true
      {{- end }}
        {{- if $app.ssoAuthWhitelist }}
        - name: sso-config
          image: {{ $app.image | quote }}
          command: ["/bin/bash", "/scripts/ensure-sso-auth.sh"]
          env:
            - name: SSO_AUTH_WHITELIST
              value: {{ $app.ssoAuthWhitelist | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: sso-script
              mountPath: /scripts
              readOnly: true
        {{- end }}
      containers:
        - name: qbittorrent
          image: {{ $app.image | quote }}
          env:
            - name: PUID
              value: {{ .Values.securityContext.puid | quote }}
            - name: PGID
              value: {{ .Values.securityContext.pgid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            {{- with $app.extraEnv }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: {{ $app.port }}
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if $app.mounts.downloads }}
            - name: downloads
              mountPath: /data/downloads
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        {{- if $app.mounts.downloads }}
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads-pvc
        {{- end }}
        {{- if $app.vpn }}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- if $app.vpn }}
        - name: nymvpn-state
          persistentVolumeClaim:
            claimName: qbittorrent-nymvpn-pvc
        - name: nymvpn-access-code
          secret:
            secretName: {{ .Values.nymVpn.secretName }}
            defaultMode: 0400
            items:
              - key: NYM_ACCESS_CODE
                path: access-code
        {{- end }}
        {{- if $app.ssoAuthWhitelist }}
        - name: sso-script
          configMap:
            name: qbittorrent-sso
            defaultMode: 0555
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: {{ $app.port }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent-ingress
  namespace: {{ .Values.namespace }}
  annotations:
{{ toYaml .Values.ingress.annotations | nindent 4 }}
{{- if $app.ssoAuthWhitelist }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-authentik-media@kubernetescrd" .Values.namespace | quote }}
{{- end }}
spec:
  rules:
    - host: {{ $app.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: {{ $app.port }}
{{- end }}

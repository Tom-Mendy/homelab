namespace: endfield

image:
  repository: forgejo.home.tom-mendy.com/tom-mendy/endfield-checkin
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: forgejo-registry-creds

registryAuth:
  createSecret: false
  secretName: forgejo-registry-creds
  server: forgejo.home.tom-mendy.com
  username: ""
  password: ""

cronJob:
  enabled: true
  schedule: "0 5 * * *"
  timeZone: "Europe/Paris"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600

# Optional one-shot job, useful for manual run by flipping enabled=true.
runOnceJob:
  enabled: false
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600

env:
  createSecret: false
  secretName: endfield-env
  values:
    ENDFIELD_CRED: ""
    ENDFIELD_SK_GAME_ROLE: ""
    ENDFIELD_PLATFORM: "3"
    ENDFIELD_VNAME: "1.0.0"
    ENDFIELD_ACCOUNT_NAME: ""
    ENABLE_DISCORD_NOTIFY: "true"
    DISCORD_WEBHOOK_URL: ""
    DISCORD_USER_ID: ""

infisicalSecret:
  enabled: true
  name: endfield-secrets
  serviceAccountName: endfield-infisical-sync
  connectionName: endfield-infisical
  authName: endfield-infisical
  identitySecretName: endfield-infisical-identity
  address: https://infisical.home.tom-mendy.com
  identityID: "b8b289b4-f869-4547-94e1-ce89928ce5a9"
  projectId: "758123bc-7eaa-4256-98a2-bb7438a783b8"
  envSlug: prod
  secretsPath: /endfield

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

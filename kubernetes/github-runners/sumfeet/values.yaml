githubConfigUrl: "https://github.com/MrAmarok/sumfeet"
githubConfigSecret: arc-github-auth-sumfeet

runnerScaleSetName: "arc-runner-set-sumfleet-tom"

scaleSetLabels:
  - self-hosted

maxRunners: 20
minRunners: 0

containerMode:
  type: "dind"

controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "4"
            memory: "4Gi"

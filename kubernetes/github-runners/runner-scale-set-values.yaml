# Configure this to your org or repo URL, for example:
# https://github.com/Tom-Mendy
# https://github.com/Tom-Mendy/homelab
githubConfigUrl: "https://github.com/Tom-Mendy/homelab"

# Create this secret in the arc-runners namespace.
# It should contain either:
# - github_token
# or GitHub App fields:
# - github_app_id
# - github_app_installation_id
# - github_app_private_key
githubConfigSecret: arc-github-auth

runnerScaleSetName: "arc-runner-set"

maxRunners: 5
minRunners: 0

# Controller is installed in arc-systems while runners are in arc-runners.
# This explicit reference avoids service account discovery issues.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"

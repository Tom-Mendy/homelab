# Inactive strategic-merge patch for identity.yaml. NOT referenced by Flux.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: flux-system
spec:
  chart:
    spec:
      version: 1.12.0
  # Chart has no strategy value. Preserve RollingUpdate ownership while
  # prohibiting surge; initial migration still REQUIRES a separate zero stage.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: infisical-infisical-standalone-infisical
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1

infisical:
  replicaCount: 1
  kubeSecretRef: infisical-secrets
  image:
    repository: infisical/infisical
    tag: v0.166.5@sha256:188b8ece6bb64e02852e948856010b45de93361a9d2974a9722c66efe94d2a35
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  extraEnv:
    - name: ALLOW_INTERNAL_IP_CONNECTIONS
      value: "true"

ingress:
  enabled: true
  hostName: infisical.home.tom-mendy.com
  ingressClassName: traefik
  nginx:
    enabled: false
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
  tls:
    - hosts:
        - infisical.home.tom-mendy.com

postgresql:
  enabled: false
  useExistingPostgresSecret:
    enabled: true
    existingConnectionStringSecret:
      name: infisical-postgres-app
      key: uri

redis:
  enabled: true
  architecture: standalone
  usePassword: false
  auth:
    enabled: false
    password: ""
  master:
    persistence:
      enabled: true
      storageClass: nfs-k8s
      size: 5Gi

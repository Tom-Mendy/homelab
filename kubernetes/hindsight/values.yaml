namespace: agent

image:
  repository: ghcr.io/vectorize-io/hindsight-api
  digest: sha256:7b14a1f4062252992d0176758753615e0a2071d9a269995be007be223ab01812
  pullPolicy: IfNotPresent

service:
  port: 8888

controlPlane:
  image:
    repository: ghcr.io/vectorize-io/hindsight-control-plane
    tag: 0.9.2@sha256:d9bf57083f7cb0a53ee5011bdfde6aae2490dbf5c360d2d1bff10473b45eb112
    pullPolicy: IfNotPresent
  service:
    port: 9999
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  host: hindsight.home.tom-mendy.com
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: agent-authentik-hindsight@kubernetescrd

persistence:
  storageClass: nfs-k8s
  size: 10Gi

ollama:
  url: http://ollama.ollama.svc.cluster.local:11434/v1
  model: gemma4:e4b
  timeout: 600

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 6Gi

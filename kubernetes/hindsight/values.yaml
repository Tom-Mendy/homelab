namespace: agent

image:
  repository: ghcr.io/vectorize-io/hindsight-api
  digest: sha256:ba832685d530055ee32c23ee4a02100bf6dc9d932f28b1c4d03c6dd33fbacaef
  pullPolicy: IfNotPresent

service:
  port: 8888

controlPlane:
  image:
    repository: ghcr.io/vectorize-io/hindsight-control-plane
    tag: "0.7.0"
    pullPolicy: IfNotPresent
  service:
    port: 9999
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  host: hindsight.home.tom-mendy.com
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: agent-authentik-hindsight@kubernetescrd

persistence:
  storageClass: nfs-k8s
  size: 10Gi

ollama:
  url: http://ollama.ollama.svc.cluster.local:11434/v1
  model: gemma4:e4b
  timeout: 600

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 6Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hindsight
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hindsight
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: ollama
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: {{ .Values.ollama.url | quote }}
            - name: HINDSIGHT_API_LLM_MODEL
              value: {{ .Values.ollama.model | quote }}
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: {{ .Values.ollama.timeout | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/hindsight/.pg0
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data

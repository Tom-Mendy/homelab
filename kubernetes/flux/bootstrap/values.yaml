web:
  enabled: true
  config:
    baseURL: https://flux.home.tom-mendy.com
    authentication:
      type: OAuth2
      oauth2:
        provider: OIDC
        clientID: flux-web
        clientSecret: ""
        issuerURL: https://authentik.home.tom-mendy.com/application/o/flux-web/
        autoLogin: true
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    hosts:
      - host: flux.home.tom-mendy.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - flux.home.tom-mendy.com

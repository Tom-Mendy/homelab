apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  distribution:
    # Keep the currently deployed release fixed during the Talos migration.
    version: 2.9.6
    registry: ghcr.io/fluxcd
  sync:
    kind: GitRepository
    url: ssh://git@forgejo.forgejo.svc.cluster.local/Tom-Mendy/homelab.git
    ref: refs/heads/main
    path: kubernetes/flux/cluster
    pullSecret: flux-system

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
spec:
  interval: 30m
  timeout: 10m
  releaseName: arc
  targetNamespace: arc-systems
  storageNamespace: arc-systems
  chartRef:
    kind: OCIRepository
    name: arc-controller
  valuesFrom:
    - kind: ConfigMap
      name: arc-controller-values
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-runners-auth
spec:
  interval: 30m
  timeout: 10m
  releaseName: github-runners-auth
  targetNamespace: arc-runners
  storageNamespace: arc-runners
  chart:
    spec:
      chart: ./kubernetes/github-runners-auth
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
  dependsOn:
    - name: arc-controller
    - name: infisical
    - name: infisical-operator
  install:
    createNamespace: true
  driftDetection:
    mode: enabled


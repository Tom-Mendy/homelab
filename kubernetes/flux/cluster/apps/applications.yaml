---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
spec:
  interval: 30m
  timeout: 10m
  releaseName: newt
  targetNamespace: newt-system
  storageNamespace: newt-system
  chart:
    spec:
      chart: newt
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: newt
  valuesFrom:
    - kind: ConfigMap
      name: newt-values
  dependsOn:
    - name: traefik
  install:
    createNamespace: true
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  driftDetection:
    mode: enabled
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
                value: 60
              - op: replace
                path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
                value: 8
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
                value: 30
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
                value: 6
              - op: add
                path: /spec/template/spec/containers/0/startupProbe
                value:
                  exec:
                    command:
                      - test
                      - -f
                      - /tmp/healthy
                  failureThreshold: 12
                  periodSeconds: 10
                  timeoutSeconds: 1
            target:
              kind: Deployment
              name: newt-newt-main-tunnel


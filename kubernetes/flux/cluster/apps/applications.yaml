---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder-extras
spec:
  interval: 30m
  timeout: 10m
  releaseName: coder-extras
  targetNamespace: coder
  storageNamespace: coder
  chart:
    spec:
      chart: ./kubernetes/coder
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
  dependsOn:
    - name: authentik
    - name: cloudnative-pg
    - name: nfs-provisioner
  driftDetection:
    mode: enabled

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder-extras
spec:
  interval: 30m
  timeout: 10m
  releaseName: coder-extras
  targetNamespace: coder
  storageNamespace: coder
  chart:
    spec:
      chart: ./kubernetes/coder
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
  dependsOn:
    - name: authentik-extras
    - name: cloudnative-pg
    - name: nfs-provisioner
  driftDetection:
    mode: enabled

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  interval: 30m
  timeout: 15m
  releaseName: coder
  targetNamespace: coder
  storageNamespace: coder
  chart:
    spec:
      chart: coder
      version: 2.35.3
      sourceRef:
        kind: HelmRepository
        name: coder
  valuesFrom:
    - kind: ConfigMap
      name: coder-values
  dependsOn:
    - name: coder-extras
    - name: traefik
  driftDetection:
    mode: enabled


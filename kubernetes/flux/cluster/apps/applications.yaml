---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
spec:
  interval: 30m
  timeout: 10m
  releaseName: newt
  targetNamespace: newt-system
  storageNamespace: newt-system
  chart:
    spec:
      chart: newt
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: newt
  valuesFrom:
    - kind: ConfigMap
      name: newt-values
  dependsOn:
    - name: traefik
  install:
    createNamespace: true
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  driftDetection:
    mode: enabled


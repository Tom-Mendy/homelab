apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: nats
  targetNamespace: poc-s3-queue-worker
  storageNamespace: poc-s3-queue-worker
  chart:
    spec:
      chart: nats
      version: 2.14.2
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: nats-values
  install:
    createNamespace: true
  driftDetection:
    mode: enabled

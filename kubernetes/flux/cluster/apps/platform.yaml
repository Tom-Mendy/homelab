apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
spec:
  interval: 30m
  timeout: 10m
  releaseName: nfs-provisioner
  targetNamespace: nfs-provisioner
  storageNamespace: nfs-provisioner
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-provisioner
  valuesFrom:
    - kind: ConfigMap
      name: nfs-provisioner-values
  install:
    createNamespace: true
  driftDetection:
    mode: enabled

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  timeout: 10m
  releaseName: cloudnative-pg
  targetNamespace: cnpg-system
  storageNamespace: cnpg-system
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.28.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
  valuesFrom:
    - kind: ConfigMap
      name: cloudnative-pg-values
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 30m
  timeout: 10m
  releaseName: traefik
  targetNamespace: traefik
  storageNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: 40.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
  dependsOn:
    - name: nfs-provisioner
  install:
    createNamespace: true
    crds: Create
    disableSchemaValidation: true
  upgrade:
    crds: CreateReplace
    disableSchemaValidation: true
  driftDetection:
    mode: enabled

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-extras
spec:
  interval: 30m
  timeout: 10m
  releaseName: traefik-extras
  targetNamespace: traefik
  storageNamespace: traefik
  chart:
    spec:
      chart: ./kubernetes/traefik
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
  dependsOn:
    - name: infisical
    - name: infisical-operator
    - name: traefik
  install:
    createNamespace: true
  driftDetection:
    mode: enabled


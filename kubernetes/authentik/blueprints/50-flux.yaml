version: 1
metadata:
  name: Flux OIDC client
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: flux-provider
    identifiers:
      name: Flux
    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      client_type: confidential
      client_id: flux-web
      client_secret: !Env [FLUX_WEB_CLIENT_SECRET, null]
      issuer_mode: per_provider
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://flux.home.tom-mendy.com/oauth2/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-offline_access]
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
  - model: authentik_core.application
    id: flux-application
    identifiers:
      slug: flux-web
    attrs:
      name: Flux
      provider: !KeyOf flux-provider
      meta_launch_url: https://flux.home.tom-mendy.com/
      meta_icon: https://flux.home.tom-mendy.com/favicon.svg
      open_in_new_tab: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flux-application
      group: !Find [authentik_core.group, [name, homelab-admins]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flux-application
      group: !Find [authentik_core.group, [name, flux-viewers]]
      order: 1
    attrs:
      enabled: true

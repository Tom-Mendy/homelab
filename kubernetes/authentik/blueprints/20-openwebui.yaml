version: 1
metadata:
  name: Open WebUI OIDC client
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: openwebui-roles-scope
    identifiers:
      name: Open WebUI roles
    attrs:
      name: Open WebUI roles
      scope_name: roles
      expression: |
        roles = []
        if ak_is_group_member(request.user, name="homelab-admins"):
          roles.extend(["openwebui-user", "openwebui-admin"])
        elif ak_is_group_member(request.user, name="openwebui-users"):
          roles.append("openwebui-user")
        return {"roles": roles}

  - model: authentik_providers_oauth2.oauth2provider
    id: openwebui-provider
    identifiers:
      name: Open WebUI
    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      client_type: confidential
      client_id: openwebui
      client_secret: !Env [OPENWEBUI_OIDC_CLIENT_SECRET, null]
      issuer_mode: per_provider
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://openwebui.home.tom-mendy.com/oauth/oidc/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
        - !KeyOf openwebui-roles-scope
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
  - model: authentik_core.application
    id: openwebui-application
    identifiers:
      slug: openwebui
    attrs:
      name: Open WebUI
      provider: !KeyOf openwebui-provider
      meta_launch_url: https://openwebui.home.tom-mendy.com/
      meta_icon: https://openwebui.home.tom-mendy.com/static/favicon.png
      open_in_new_tab: true
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf openwebui-application
      group: !Find [authentik_core.group, [name, homelab-admins]]
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf openwebui-application
      group: !Find [authentik_core.group, [name, openwebui-users]]
      order: 1
    attrs:
      enabled: true

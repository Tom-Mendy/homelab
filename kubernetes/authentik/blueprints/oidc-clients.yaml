      group: !KeyOf homelab-admins
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf radarr-application
      group: !KeyOf radarr-users
      order: 1
    attrs:
      enabled: true

  - model: authentik_providers_proxy.proxyprovider

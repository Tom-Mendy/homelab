version: 1
metadata:
  name: Homelab OIDC clients
entries:
  - model: authentik_core.group
    id: homelab-admins
    identifiers:
      name: homelab-admins
    attrs:
      is_superuser: true
  - model: authentik_core.group
    id: homelab-guests
    identifiers:
      name: homelab-guests
  - model: authentik_core.group
    id: forgejo-users
    identifiers:
      name: forgejo-users
  - model: authentik_core.group
    id: grafana-users
    identifiers:
      name: grafana-users
  - model: authentik_core.group
    id: flux-viewers
    identifiers:
      name: flux-viewers

  - model: authentik_providers_oauth2.oauth2provider
    id: forgejo-provider
    identifiers:
      name: forgejo
    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      client_type: confidential
      client_id: forgejo
      client_secret: !Env [FORGEJO_OIDC_CLIENT_SECRET, null]
      issuer_mode: per_provider
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://forgejo.tom-mendy.com/user/oauth2/authentik/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-offline_access]
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
  - model: authentik_core.application
    id: forgejo-application
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf forgejo-provider
      meta_launch_url: https://forgejo.tom-mendy.com/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf forgejo-application
      group: !KeyOf homelab-admins
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf forgejo-application
      group: !KeyOf forgejo-users
      order: 1
    attrs:
      enabled: true

  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      client_type: confidential
      client_id: grafana
      client_secret: !Env [GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, null]
      issuer_mode: per_provider
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.home.tom-mendy.com/login/generic_oauth
          redirect_uri_type: authorization
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-offline_access]
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
  - model: authentik_core.application
    id: grafana-application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://grafana.home.tom-mendy.com/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-application
      group: !KeyOf homelab-admins
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana-application
      group: !KeyOf grafana-users
      order: 1
    attrs:
      enabled: true

  - model: authentik_providers_oauth2.oauth2provider
    id: flux-provider
    identifiers:
      name: Flux
    attrs:
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      client_type: confidential
      client_id: flux-web
      client_secret: !Env [FLUX_WEB_CLIENT_SECRET, null]
      issuer_mode: per_provider
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - matching_mode: strict
          url: https://flux.home.tom-mendy.com/oauth2/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-offline_access]
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - [name, authentik Self-signed Certificate]
  - model: authentik_core.application
    id: flux-application
    identifiers:
      slug: flux-web
    attrs:
      name: Flux
      provider: !KeyOf flux-provider
      meta_launch_url: https://flux.home.tom-mendy.com/
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flux-application
      group: !KeyOf homelab-admins
      order: 0
    attrs:
      enabled: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flux-application
      group: !KeyOf flux-viewers
      order: 1
    attrs:
      enabled: true

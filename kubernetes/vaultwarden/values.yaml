namespace: vaultwarden
createNamespace: true

replicaCount: 1

image:
  repository: vaultwarden/server
  tag: 1.37.0-alpine@sha256:88b74551f5d79fd43f897c23bd74d5295a6e1fafb5d1ec23a1da92e7a0f06767
  pullPolicy: IfNotPresent

deploymentAnnotations:
  keel.sh/policy: all

domain: https://vaultwarden.home.tom-mendy.com

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: vaultwarden.home.tom-mendy.com
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

storage:
  pvName: vaultwarden-data-pv
  pvcName: vaultwarden-data-pvc
  size: 10Gi
  nfsServer: 10.0.0.11
  nfsPath: /volume1/vaultwarden

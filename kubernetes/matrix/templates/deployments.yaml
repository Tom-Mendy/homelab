apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuwunel
  namespace: {{ .Values.namespace }}
  annotations:
{{ toYaml .Values.deploymentAnnotations | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tuwunel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuwunel
    spec:
      # Kubernetes otherwise injects TUWUNEL_PORT=tcp://... from the Service;
      # Tuwunel treats TUWUNEL_* as configuration and rejects that URL as a port.
      enableServiceLinks: false
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tuwunel
          image: {{ .Values.tuwunel.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/tuwunel/tuwunel.toml
          ports:
            - name: http
              containerPort: 8008
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /_tuwunel/server_version
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_tuwunel/server_version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
{{ toYaml .Values.tuwunel.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tuwunel/tuwunel.toml
              subPath: tuwunel.toml
              readOnly: true
            - name: oidc
              mountPath: /run/secrets/oidc-client-secret
              subPath: oidc-client-secret
              readOnly: true
            - name: runtime
              mountPath: /run/secrets/registration-shared-secret
              subPath: registration-shared-secret
              readOnly: true
            - name: data
              mountPath: /var/lib/tuwunel
            - name: backups
              mountPath: /var/lib/tuwunel-backups
      volumes:
        - name: config
          configMap:
            name: tuwunel-config
        - name: oidc
          secret:
            secretName: matrix-oidc
        - name: runtime
          secret:
            secretName: matrix-runtime
        - name: data
          persistentVolumeClaim:
            claimName: tuwunel-data
        - name: backups
          persistentVolumeClaim:
            claimName: tuwunel-backups
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinny
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cinny
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinny
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cinny
          image: {{ .Values.cinny.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
{{ toYaml .Values.cinny.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cinny-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-rtc
  namespace: {{ .Values.namespace }}
  annotations:
{{ toYaml .Values.deploymentAnnotations | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-rtc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-rtc
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command:
            - sh
            - -c
            - |
              sed -e "s/__LIVEKIT_KEY__/$LIVEKIT_KEY/" \
                  -e "s/__LIVEKIT_SECRET__/$LIVEKIT_SECRET/" \
                  /config/livekit.yaml > /rendered/livekit.yaml
          envFrom:
            - secretRef:
                name: matrix-runtime
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: rendered
              mountPath: /rendered
      containers:
        - name: livekit
          image: {{ .Values.rtc.livekitImage }}
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/livekit/livekit.yaml"]
          ports:
            - name: websocket
              containerPort: 7880
            - name: rtc-tcp
              containerPort: 7881
            {{- range $port := untilStep 50100 50111 1 }}
            - name: udp-{{ $port }}
              containerPort: {{ $port }}
              protocol: UDP
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.rtc.resources.livekit | nindent 12 }}
          volumeMounts:
            - name: rendered
              mountPath: /etc/livekit
              readOnly: true
        - name: jwt
          image: {{ .Values.rtc.jwtImage }}
          imagePullPolicy: IfNotPresent
          env:
            - name: LIVEKIT_JWT_BIND
              value: :8081
            - name: LIVEKIT_URL
              value: wss://{{ .Values.rtc.host }}
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: matrix-runtime
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrix-runtime
                  key: LIVEKIT_SECRET
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: {{ .Values.tuwunel.host }}
          ports:
            - name: jwt
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: jwt
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.rtc.resources.jwt | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: livekit-config
        - name: rendered
          emptyDir: {}

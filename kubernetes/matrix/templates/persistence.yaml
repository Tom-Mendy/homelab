apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuwunel-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.tuwunel.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.tuwunel.storage.dataSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuwunel-backups
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.tuwunel.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.tuwunel.storage.backupSize }}

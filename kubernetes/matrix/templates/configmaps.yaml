apiVersion: v1
kind: ConfigMap
metadata:
  name: tuwunel-config
  namespace: {{ .Values.namespace }}
data:
  tuwunel.toml: |
    [global]
    server_name = "{{ .Values.tuwunel.host }}"
    database_path = "/var/lib/tuwunel"
    database_backup_path = "/var/lib/tuwunel-backups"
    database_backups_to_keep = 3
    address = ["0.0.0.0"]
    port = 8008
    max_request_size = "100 MiB"
    allow_federation = true
    allow_registration = true
    allow_guest_registration = false
    login_with_password = false
    allow_public_room_directory_over_federation = false
    allow_public_room_directory_without_auth = false
    ip_source = "rightmost_x_forwarded_for"
    registration_shared_secret_file = "/run/secrets/registration-shared-secret"

    [[global.identity_provider]]
    brand = "Authentik"
    client_id = "matrix"
    client_secret_file = "/run/secrets/oidc-client-secret"
    issuer_url = "https://authentik.tom-mendy.com/application/o/matrix/"
    callback_url = "https://{{ .Values.tuwunel.host }}/_matrix/client/unstable/login/sso/callback/matrix"
    default = true
    name = "Authentik"
    trusted = false
    registration = true
    userid_claims = ["preferred_username"]
    unique_id_fallbacks = false

    [global.well_known]
    client = "https://{{ .Values.tuwunel.host }}"
    server = "{{ .Values.tuwunel.host }}:443"
    livekit_url = "https://{{ .Values.rtc.host }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinny-config
  namespace: {{ .Values.namespace }}
data:
  config.json: |
    {
      "defaultHomeserver": 0,
      "homeserverList": ["{{ .Values.tuwunel.host }}"],
      "allowCustomHomeservers": false,
      "featuredCommunities": {
        "openAsDefault": false,
        "spaces": [],
        "rooms": [],
        "servers": []
      },
      "hashRouter": {
        "enabled": false,
        "basename": "/"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: {{ .Values.namespace }}
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      # ponytail: eleven UDP ports suit small personal calls; widen through
      # Pangolin and this Service when concurrent media tracks exhaust them.
      port_range_start: 50100
      port_range_end: 50110
      use_external_ip: false
      node_ip: "{{ .Values.rtc.publicIp }}"
      enable_loopback_candidate: false
    room:
      auto_create: false
    keys:
      __LIVEKIT_KEY__: __LIVEKIT_SECRET__

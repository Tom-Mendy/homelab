apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: {{ .Values.infisicalSecret.connectionName }}
  namespace: {{ .Values.namespace }}
spec:
  address: {{ .Values.infisicalSecret.address | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.infisicalSecret.identitySecretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  identityId: {{ .Values.infisicalSecret.identityID | quote }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: {{ .Values.infisicalSecret.authName }}
  namespace: {{ .Values.namespace }}
spec:
  method: kubernetes
  infisicalConnectionRef:
    name: {{ .Values.infisicalSecret.connectionName }}
    namespace: {{ .Values.namespace }}
  kubernetes:
    identityIdRef:
      name: {{ .Values.infisicalSecret.identitySecretName }}
      namespace: {{ .Values.namespace }}
      key: identityId
    serviceAccountRef:
      name: {{ .Values.infisicalSecret.serviceAccountName }}
      namespace: {{ .Values.namespace }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: matrix-runtime
  namespace: {{ .Values.namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisicalSecret.authName }}
    namespace: {{ .Values.namespace }}
  sources:
    - projectId: {{ .Values.infisicalSecret.projectId | quote }}
      environmentSlug: {{ .Values.infisicalSecret.envSlug | quote }}
      secretPath: {{ .Values.infisicalSecret.secretsPath | quote }}
      recursive: false
  targets:
    - name: matrix-runtime
      namespace: {{ .Values.namespace }}
      kind: Secret
      creationPolicy: Orphan
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          registration-shared-secret: "{{`{{ .MATRIX_REGISTRATION_SHARED_SECRET.Value }}`}}"
          LIVEKIT_KEY: "{{`{{ .LIVEKIT_KEY.Value }}`}}"
          LIVEKIT_SECRET: "{{`{{ .LIVEKIT_SECRET.Value }}`}}"
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: hermes-matrix
  namespace: {{ .Values.namespace }}
spec:
  infisicalAuthRef:
    name: {{ .Values.infisicalSecret.authName }}
    namespace: {{ .Values.namespace }}
  sources:
    - projectId: {{ .Values.infisicalSecret.projectId | quote }}
      environmentSlug: {{ .Values.infisicalSecret.envSlug | quote }}
      secretPath: {{ .Values.infisicalSecret.secretsPath | quote }}
      recursive: false
  targets:
    - name: hermes-matrix
      namespace: coder-workspaces
      kind: Secret
      creationPolicy: Orphan
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          MATRIX_ACCESS_TOKEN: "{{`{{ .HERMES_MATRIX_ACCESS_TOKEN.Value }}`}}"
          MATRIX_ALLOWED_USERS: "{{`{{ .HERMES_MATRIX_ALLOWED_USERS.Value }}`}}"
          MATRIX_RECOVERY_KEY: "{{`{{ .HERMES_MATRIX_RECOVERY_KEY.Value }}`}}"
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false

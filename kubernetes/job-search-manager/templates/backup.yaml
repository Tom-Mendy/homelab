apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-search-manager-backups
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: {{ .Values.database.storageClass }}
  resources:
    requests:
      storage: 30Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-search-manager-postgres-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: "30 2 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.database.image }}
              command: ["/bin/sh", "-ec"]
              args:
                - stamp=$(date -u +%Y%m%dT%H%M%SZ); tmp=$(mktemp /backups/.pgdump.XXXXXX); trap 'rm -f "$tmp" "$tmp.gz"' EXIT; pg_dump "$DATABASE_URL" > "$tmp"; gzip -c "$tmp" > "$tmp.gz"; mv "$tmp.gz" "/backups/postgres-$stamp.sql.gz"; rm -f "$tmp"; trap - EXIT; find /backups -maxdepth 1 -type f -name 'postgres-*.sql.gz' -mtime +30 -delete
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: job-search-manager-postgres-app
                      key: uri
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: job-search-manager-backups}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-search-manager-objects-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              command: ["aws"]
              args: ["s3", "sync", "s3://{{ .Values.garage.bucket }}", "/backups/objects", "--endpoint-url", "http://job-search-manager-garage:3900"]
              env:
                - {name: AWS_DEFAULT_REGION, value: garage}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.runtimeSecret }}
                      key: S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.runtimeSecret }}
                      key: S3_SECRET_ACCESS_KEY
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: job-search-manager-backups}

  db:
    name: atuin
    user: ""
    password: ""
  storage:
    pvName: ""
    pvcName: atuin-config-v2
    size: 20Gi
    accessMode: ReadWriteMany
    reclaimPolicy: Retain
    storageClassName: nfs-k8s
    nfsServer: ""
    nfsPath: ""


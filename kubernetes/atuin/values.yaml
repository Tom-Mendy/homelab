namespace: atuin

replicaCount: 1

nfsPermissions:
  userUid: "1023"
  userGid: "100"

atuin:
  image:
    repository: ghcr.io/atuinsh/atuin
    tag: latest
    pullPolicy: IfNotPresent
  host: atuin.home.tom-mendy.com
  port: 8888
  openRegistration: false
  db:
    name: atuin
    user: atuin
    password: atuinpassword
  storage:
    pvName: atuin-data-pv
    size: 20Gi
    accessMode: ReadWriteMany
    reclaimPolicy: Retain
    storageClassName: ""
    nfsServer: 192.168.1.1
    nfsPath: /volume1/atuin/db

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  port: 5432
  storage:
    pvName: atuin-postgres-data-pv
    size: 10Gi
    accessMode: ReadWriteOnce
    reclaimPolicy: Retain
    storageClassName: ""
    nfsServer: 192.168.1.1
    nfsPath: /volume1/atuin/postgres

deploymentAnnotations:
  keel.sh/policy: all

service:
  type: ClusterIP

ingress:
  enabled: true
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
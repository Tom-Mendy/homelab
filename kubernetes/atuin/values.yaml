namespace: atuin

replicaCount: 1

nfsPermissions:
  userUid: "1025"
  userGid: "100"

atuin:
  image:
    repository: ghcr.io/atuinsh/atuin
    tag: 18.23.0@sha256:f232feeead54a0a13132b9cd477e312c3380e9dc90f1db24c4f79ce6c8e034ea
    pullPolicy: IfNotPresent
  host: atuin.home.tom-mendy.com
  port: 8888

namespace: atuin

replicaCount: 1

nfsPermissions:
  userUid: "1025"
  userGid: "100"

atuin:
  image:
    repository: ghcr.io/atuinsh/atuin
    tag: latest
    pullPolicy: IfNotPresent
  host: atuin.home.tom-mendy.com
  port: 8888
  openRegistration: false
  db:
    name: atuin
    user: atuin
    password: atuinpassword
  storage:
    pvName: ""
    pvcName: atuin-config-v2
    size: 20Gi
    accessMode: ReadWriteMany
    reclaimPolicy: Retain
    storageClassName: nfs-k8s
    nfsServer: ""
    nfsPath: ""

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  port: 5432
  storage:
    pvName: ""
    pvcName: postgres-data-v2
    size: 10Gi
    accessMode: ReadWriteOnce
    reclaimPolicy: Retain
    storageClassName: nfs-k8s
    nfsServer: ""
    nfsPath: ""

deploymentAnnotations:
  keel.sh/policy: all

service:
  type: ClusterIP

ingress:
  enabled: true
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

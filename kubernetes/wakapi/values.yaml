namespace: wakapi
createNamespace: true

replicaCount: 1

image:
  repository: ghcr.io/muety/wakapi
  tag: 2.17.6@sha256:00662767731a6797d4be02cbc6c3f32b7ff8d0c683ee10ec5612856d4efbb3bf
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  host: wakapi.home.tom-mendy.com
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

dataStorage:
  pvcName: wakapi-data-pvc
  size: 5Gi
  storageClassName: nfs-k8s

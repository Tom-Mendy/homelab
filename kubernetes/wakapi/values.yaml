namespace: wakapi
createNamespace: true

replicaCount: 1

image:
  repository: ghcr.io/muety/wakapi
  tag: 2.18.1@sha256:e761af46c49ea381ceccbb6643ebc5ca5a644efc4ca5bf5b56ed01ca16808c25
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  host: wakapi.home.tom-mendy.com
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

dataStorage:
  pvcName: wakapi-data-pvc
  size: 5Gi
  storageClassName: nfs-k8s

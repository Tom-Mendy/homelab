{{- if .Values.sshIngress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: forgejo-ssh-ingress
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - {{ .Values.sshIngress.entryPoint }}
  routes:
    - match: HostSNI(`*`)
      services:
        - name: forgejo
          port: {{ .Values.service.sshPort }}
{{- end }}

namespace: forgejo
createNamespace: true

replicaCount: 1

image:
  repository: codeberg.org/forgejo/forgejo
  tag: "15"
  pullPolicy: IfNotPresent

deploymentAnnotations:
  keel.sh/policy: all

user:
  uid: "1023"
  gid: "100"

rootUrl: https://forgejo.tom-mendy.com/

database:
  type: postgres
  host: forgejo-postgres-rw.forgejo.svc.cluster.local:5432
  name: forgejo
  sslMode: disable
  secretName: forgejo-postgres-app

oauth2Client:
  enableAutoRegistration: true
  username: nickname

oidc:
  enabled: true
  secretName: forgejo-oidc

actions:
  enabled: "true"
  defaultActionsUrl: https://data.forgejo.org

service:
  type: ClusterIP
  httpPort: 3000
  sshPort: 22

ingress:
  enabled: true
  host: forgejo.tom-mendy.com
  aliases:
    - forgejo.home.tom-mendy.com
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

sshIngress:
  enabled: true
  entryPoint: forgejo-ssh

storage:
  pvName: forgejo-data-pv
  pvcName: forgejo-data-pvc
  size: 20Gi
  nfsServer: 10.0.0.11
  nfsPath: /volume1/forgejo

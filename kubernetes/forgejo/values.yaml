namespace: forgejo
createNamespace: true

replicaCount: 1

image:
  repository: codeberg.org/forgejo/forgejo
  tag: 15.0.9@sha256:91a5310c86934339e16bd06b6078aada836e3d8935b2d70f6598108cbfaed5d1
  pullPolicy: IfNotPresent

user:
  uid: "1023"
  gid: "100"

rootUrl: https://forgejo.tom-mendy.com/
sshDomain: forgejo.tom-mendy.com

database:
  type: postgres
  host: forgejo-postgres-rw.forgejo.svc.cluster.local:5432
  name: forgejo
  sslMode: disable
  secretName: forgejo-postgres-app

cluster:
  name: forgejo-postgres
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  storage:
    size: 20Gi
    storageClass: nfs-k8s
  database: forgejo
  owner: forgejo

oauth2Client:
  enableAutoRegistration: true
  username: nickname

oidc:
  enabled: true
  secretName: forgejo-oidc
  discoveryUrl: https://authentik.tom-mendy.com/application/o/forgejo/.well-known/openid-configuration

actions:
  enabled: "true"
  defaultActionsUrl: https://data.forgejo.org

service:
  type: ClusterIP
  httpPort: 3000
  sshPort: 22

ingress:
  enabled: true
  host: forgejo.tom-mendy.com
  aliases:
    - forgejo.home.tom-mendy.com
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

sshIngress:
  enabled: true
  entryPoint: forgejo-ssh

storage:
  pvName: forgejo-data-pv
  pvcName: forgejo-data-pvc
  size: 20Gi
  nfsServer: 10.0.0.11
  nfsPath: /volume1/forgejo

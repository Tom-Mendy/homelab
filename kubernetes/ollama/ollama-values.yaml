ollama:
  gpu:
    # -- Enable GPU integration
    enabled: true

    # -- GPU type: 'nvidia' or 'amd'
    type: 'nvidia'

    # -- Specify the number of GPU to 1
    number: 1

  # -- List of models to pull at container startup
  models:
    pull:
      - qwen3:8b

deployment:
  annotations:
    keel.sh/policy: all

tolerations: []
nodeSelector:
  gpu: "true"

resources:
  limits:
    nvidia.com/gpu: 1 # Number of GPUs to allocate

runtimeClassName: nvidia # Use the NVIDIA runtime for GPU support
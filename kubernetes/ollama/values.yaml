namespace: ollama

image:
  repository: ollama/ollama
  tag: 0.30.11@sha256:c484b703176aa19dfc0a54cbfb60ab8094b38faa04283fb77eba1d33319e5eca
  pullPolicy: IfNotPresent

deployment:
  strategy: Recreate

models:
  pull:
    - gemma4:e4b
    - deepseek-r1:8b

nodeSelector:
  gpu: "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

resources:
  limits:
    nvidia.com/gpu: 1

persistence:
  enabled: true
  storageClass: nfs-k8s
  size: 50Gi

service:
  port: 11434

ingress:
  enabled: true
  host: ollama.home.tom-mendy.com
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

gpu:
  runtimeClass:
    enabled: true
    name: nvidia
    handler: nvidia
  devicePlugin:
    enabled: true
    namespace: kube-system
    image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
    nodeSelector:
      gpu: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

openwebui:
  namespaceOverride: ollama
  fullnameOverride: open-webui

  ollama:
    enabled: false
  ollamaUrls:
    - http://ollama:11434

  deployment:
  service:
    type: ClusterIP
    port: 8080

  persistence:
    enabled: true
    existingClaim: open-webui
    storageClass: nfs-k8s
    size: 50Gi
    volumeName: pvc-090fcf5b-66f0-457f-9279-f5167b075af5

  pipelines:
    enabled: false
    persistence:
      storageClass: nfs-k8s
      size: 50Gi

  websocket:
    enabled: false

  ingress:
    enabled: false

  extraEnvVars:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: openwebui-postgres-app
          key: uri
    - name: ENABLE_WEB_SEARCH
      value: "true"
    - name: WEB_SEARCH_ENGINE
      value: "searxng"
    - name: SEARXNG_QUERY_URL
      value: "http://searxng.searxng.svc.cluster.local:8080/search"
    - name: SEARXNG_LANGUAGE
      value: "all"

  sso:
    enabled: true
    enableSignup: true
    enableRoleManagement: true
    oidc:
      enabled: true
      clientId: openwebui
      clientExistingSecret: openwebui-oidc
      clientExistingSecretKey: OPENWEBUI_OIDC_CLIENT_SECRET
      providerUrl: https://authentik.home.tom-mendy.com/application/o/openwebui/.well-known/openid-configuration
      providerName: Authentik
      scopes: "openid email profile roles"
    roleManagement:
      rolesClaim: roles
      allowedRoles: openwebui-user,openwebui-admin
      adminRoles: openwebui-admin

openwebuiIngress:
  name: openwebui-ingress
  host: openwebui.home.tom-mendy.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

openwebuiPostgres:
  name: openwebui-postgres
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 10Gi
    storageClass: nfs-k8s
  database: openwebui
  owner: openwebui

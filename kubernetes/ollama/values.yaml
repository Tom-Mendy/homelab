namespace: ollama

image:
  repository: ollama/ollama
  tag: latest
  pullPolicy: IfNotPresent

deployment:
  annotations:
    keel.sh/policy: all
  strategy: Recreate

models:
  pull:
    - gemma4:e4b
    - deepseek-r1:8b

nodeSelector:
  gpu: "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

resources:
  limits:
    nvidia.com/gpu: 1

persistence:
  enabled: true
  storageClass: nfs-k8s
  size: 50Gi

service:
  port: 11434

ingress:
  enabled: true
  host: ollama.home.tom-mendy.com
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

gpu:
  runtimeClass:
    enabled: true
    name: nvidia
    handler: nvidia
  devicePlugin:
    enabled: true
    namespace: kube-system
    image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
    nodeSelector:
      gpu: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

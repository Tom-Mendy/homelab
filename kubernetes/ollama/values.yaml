namespace: ollama

image:
  repository: ollama/ollama
  tag: 0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
  pullPolicy: IfNotPresent

deployment:
  strategy: Recreate

models:
  pull:
    - gemma4:e4b
    - deepseek-r1:8b
    - SparkLLM/Spark-X2.5-4B:latest

nodeSelector:
  gpu: "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

resources:
  limits:
    nvidia.com/gpu: 1

persistence:
  enabled: true
  storageClass: nfs-k8s
  size: 50Gi

service:
  port: 11434

ingress:
  enabled: true
  host: ollama.home.tom-mendy.com
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

gpu:
  runtimeClass:
    enabled: true
    name: nvidia
    handler: nvidia
  devicePlugin:
    enabled: true
    namespace: kube-system
    image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1@sha256:27c1b2553a690ca3d29889dcd61df97525d46f58272c0be8dc63c2b18f120075
    nodeSelector:
      gpu: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule

openwebui:
  namespaceOverride: ollama
  fullnameOverride: open-webui

  image:
    repository: ghcr.io/open-webui/open-webui
    tag: 0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    pullPolicy: IfNotPresent

  ollama:
    enabled: false
  ollamaUrls:
    - http://ollama:11434

  deployment:
  service:
    type: ClusterIP
    port: 8080

  persistence:
    enabled: true
    existingClaim: open-webui
    storageClass: nfs-k8s
    size: 50Gi
    volumeName: pvc-090fcf5b-66f0-457f-9279-f5167b075af5

  pipelines:
    enabled: false
    persistence:
      storageClass: nfs-k8s
      size: 50Gi

  websocket:
    enabled: false

  ingress:
    enabled: false

  extraEnvVars:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: openwebui-postgres-app
          key: uri
    - name: ENABLE_WEB_SEARCH
      value: "true"
    - name: WEB_SEARCH_ENGINE
      value: "searxng"
    - name: SEARXNG_QUERY_URL
      value: "http://searxng.searxng.svc.cluster.local:8080/search"
    - name: SEARXNG_LANGUAGE
      value: "all"

  sso:
    enabled: true
    enableSignup: true
    enableRoleManagement: true
    oidc:
      enabled: true
      clientId: openwebui
      clientExistingSecret: openwebui-oidc
      clientExistingSecretKey: OPENWEBUI_OIDC_CLIENT_SECRET
      providerUrl: https://authentik.tom-mendy.com/application/o/openwebui/.well-known/openid-configuration
      providerName: Authentik
      scopes: "openid email profile roles"
    roleManagement:
      rolesClaim: roles
      allowedRoles: openwebui-user,openwebui-admin
      adminRoles: openwebui-admin

openwebuiFunctionSync:
  enabled: true
  schedule: "*/10 * * * *"

openwebuiIngress:
  name: openwebui-ingress
  host: openwebui.home.tom-mendy.com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

openwebuiPostgres:
  name: openwebui-postgres
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  storage:
    size: 10Gi
    storageClass: nfs-k8s
  database: openwebui
  owner: openwebui

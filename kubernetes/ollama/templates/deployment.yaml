apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
  labels:
{{ include "ollama-local.labels" . | nindent 4 }}
{{- with .Values.deployment.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.deployment.strategy | default "Recreate" }}
  selector:
    matchLabels:
{{ include "ollama-local.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "ollama-local.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.gpu.runtimeClass.enabled }}
      runtimeClassName: {{ .Values.gpu.runtimeClass.name }}
      {{- end }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (len .Values.models.pull) 0 }}
      initContainers:
        - name: pull-models
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export OLLAMA_HOST=127.0.0.1:11434
              ollama serve >/tmp/ollama-init.log 2>&1 &
              OLLAMA_PID=$!

              # Wait for the local Ollama API to become available.
              for i in $(seq 1 60); do
                if ollama list >/dev/null 2>&1; then
                  break
                fi
                if [ "$i" -eq 60 ]; then
                  echo "Ollama server did not become ready in time"
                  kill "$OLLAMA_PID" || true
                  exit 1
                fi
                sleep 1
              done

              {{- range .Values.models.pull }}
              ollama pull {{ . | quote }}
              {{- end }}

              kill "$OLLAMA_PID" || true
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - ollama serve
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
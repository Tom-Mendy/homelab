{{- if .Values.openwebuiFunctionSync.enabled }}
{{- $function := .Files.Get "files/openwebui-functions/token_usage_display.py" }}
{{- $sync := .Files.Get "files/openwebui-functions/sync.py" }}
{{- $checksum := printf "%s%s%s" $function $sync (toJson .Values.openwebuiFunctionSync) | sha256sum | trunc 10 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-functions
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ollama-local.labels" . | nindent 4 }}
data:
  token_usage_display.py: |
    {{- $function | nindent 4 }}
  sync.py: |
    {{- $sync | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openwebui-function-sync-{{ $checksum }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ollama-local.labels" . | nindent 4 }}
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: openwebui-function-sync
        {{- include "ollama-local.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: "{{ .Values.openwebui.image.repository }}:{{ .Values.openwebui.image.tag }}"
          imagePullPolicy: {{ .Values.openwebui.image.pullPolicy }}
          command: [python, /functions/sync.py]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openwebui-postgres-app
                  key: uri
          volumeMounts:
            - name: functions
              mountPath: /functions
              readOnly: true
      volumes:
        - name: functions
          configMap:
            name: openwebui-functions
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openwebui-function-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ollama-local.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.openwebuiFunctionSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 5
      template:
        metadata:
          labels:
            app.kubernetes.io/component: openwebui-function-sync
            {{- include "ollama-local.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: "{{ .Values.openwebui.image.repository }}:{{ .Values.openwebui.image.tag }}"
              imagePullPolicy: {{ .Values.openwebui.image.pullPolicy }}
              command: [python, /functions/sync.py]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: openwebui-postgres-app
                      key: uri
              volumeMounts:
                - name: functions
                  mountPath: /functions
                  readOnly: true
          volumes:
            - name: functions
              configMap:
                name: openwebui-functions
{{- end }}

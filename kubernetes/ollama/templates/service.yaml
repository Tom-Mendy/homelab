apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: {{ .Values.namespace }}
  labels:
{{ include "ollama-local.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
{{ include "ollama-local.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
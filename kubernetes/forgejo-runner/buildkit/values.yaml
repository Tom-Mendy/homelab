runner:
  name: forgejo-runner-buildkit
  secretName: forgejo-runner-buildkit
  labels:
    - buildkit:docker://harbor.home.tom-mendy.com/homelab/ci/buildkit-forgejo@sha256:2974f53f0c1e4fa2486c7b6dd7aacb1bb76bfbda2735744e78143491c71b26e4
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "4Gi"

docker:
  containerOptions: >-
    --add-host=dind.docker.internal:host-gateway
    --security-opt seccomp=unconfined
    --security-opt apparmor=unconfined
    --security-opt systempaths=unconfined

registryAuth:
  enabled: false

infisicalSecret:
  enabled: false

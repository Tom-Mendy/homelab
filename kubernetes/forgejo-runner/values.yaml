namespace: forgejo-runner
createNamespace: true

replicaCount: 1

forgejo:
  url: http://forgejo.forgejo.svc.cluster.local:3000/

runner:
  name: forgejo-runner-homelab
  image:
    repository: data.forgejo.org/forgejo/runner
    tag: 13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
    pullPolicy: IfNotPresent
  secretName: forgejo-runner-homelab
  logLevel: info
  capacity: 1
  timeout: 3h
  labels:
    - debian:docker://docker.io/library/node:lts
    - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

docker:
  host: tcp://127.0.0.1:2375
  jobHost: tcp://dind.docker.internal:2375
  containerOptions: --add-host=dind.docker.internal:host-gateway
  image:
    repository: docker
    tag: dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

registryAuth:
  enabled: false
  secretName: forgejo-runner-harbor-ci
  usernameKey: HARBOR_CI_USERNAME
  tokenKey: HARBOR_CI_TOKEN

infisicalSecret:
  enabled: false

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.runner.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.runner.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.runner.name }}
      annotations:
        checksum/runner-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
      containers:
        - name: docker
          image: "{{ .Values.docker.image.repository }}:{{ .Values.docker.image.tag }}"
          imagePullPolicy: {{ .Values.docker.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            {{- if .Values.registryAuth.enabled }}
            - name: HARBOR_CI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryAuth.secretName }}
                  key: {{ .Values.registryAuth.usernameKey }}
            - name: HARBOR_CI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryAuth.secretName }}
                  key: {{ .Values.registryAuth.tokenKey }}
            {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              {{- if .Values.registryAuth.enabled }}
              mkdir -p /root/.docker
              auth="$$(printf '%s:%s' "$${HARBOR_CI_USERNAME}" "$${HARBOR_CI_TOKEN}" | base64 | tr -d '\\n')"
              printf '{"auths":{"harbor.home.tom-mendy.com":{"auth":"%s"}}}\n' "$${auth}" > /root/.docker/config.json
              {{- end }}
              exec dockerd "$${@}"
            - --
          args:
            - -H
            - tcp://0.0.0.0:2375
            - --tls=false
          ports:
            - containerPort: 2375
              name: docker
          resources:
{{ toYaml .Values.docker.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: docker
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: docker
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
        - name: runner
          image: "{{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
          env:
            - name: DOCKER_HOST
              value: {{ .Values.docker.host | quote }}
            - name: RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.secretName }}
                  key: uuid
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.secretName }}
                  key: token
          command:
            - /bin/sh
            - -ec
            - |
              cp /etc/forgejo-runner/config.yaml /data/config.yaml
              cat >> /data/config.yaml <<EOF

              server:
                connections:
                  forgejo:
                    url: {{ .Values.forgejo.url | quote }}
                    uuid: ${RUNNER_UUID}
                    token: ${RUNNER_TOKEN}
              EOF
              sleep 5
              while true; do
                if forgejo-runner --config /data/config.yaml one-job --wait; then
                  continue
                fi
                sleep 5
              done
          resources:
{{ toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            - name: runner-config
              mountPath: /etc/forgejo-runner
              readOnly: true
            - name: runner-data
              mountPath: /data
      volumes:
        - name: runner-config
          configMap:
            name: {{ .Values.runner.name }}-config
        - name: runner-data
          emptyDir: {}
        - name: docker-data
          emptyDir:
            {{- with .Values.docker.dataSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}

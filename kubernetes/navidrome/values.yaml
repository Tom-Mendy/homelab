namespace: navidrome
createNamespace: true

replicaCount: 1

image:
  repository: deluan/navidrome
  tag: 0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4533

ingress:
  enabled: true
  host: navidrome.home.tom-mendy.com
  className: ""
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt

musicStorage:
  pvName: navidrome-music-pv
  pvcName: navidrome-music-pvc
  size: 200Gi
  nfsServer: 10.0.0.11
  nfsPath: /volume1/music

dataStorage:
  pvcName: navidrome-data-pvc
  size: 5Gi
  storageClassName: nfs-k8s

apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  {{- if not .Values.migrationBridgeAddress }}
  selector:
    app: navidrome
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}

{{- if .Values.migrationBridgeAddress }}
---
# Temporary migration route; remove when LAN ingress moves directly to Talos.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: navidrome-talos-bridge
  namespace: {{ .Values.namespace }}
  labels:
    kubernetes.io/service-name: navidrome
    endpointslice.kubernetes.io/managed-by: homelab-talos-migration
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - {{ .Values.migrationBridgeAddress | quote }}
    conditions:
      ready: true
{{- end }}

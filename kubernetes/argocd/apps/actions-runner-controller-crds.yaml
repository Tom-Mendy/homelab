apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actions-runner-controller-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/actions/actions-runner-controller.git
    targetRevision: master
    path: charts/gha-runner-scale-set-controller/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

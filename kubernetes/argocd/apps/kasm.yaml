apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: https://github.com/kasmtech/kasm-helm.git
      targetRevision: release/1.18.1
      path: charts/kasm
      helm:
        releaseName: kasm
        valueFiles:
          - $values/kubernetes/kasm/kasm-values.yaml
    - repoURL: ssh://git@forgejo.forgejo.svc.cluster.local/Tom-Mendy/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kasm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

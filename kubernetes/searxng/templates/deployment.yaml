apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: {{ .Values.namespace }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      containers:
        {{- if .Values.vpn.enabled }}
        - name: gluetun
          image: qmcgaw/gluetun:latest@sha256:8e92dcb57ed64b0e4469c933f00ee1f09ee00867fee150e783a95fa6b53effa4
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: {{ .Values.vpn.serviceProvider | quote }}
            - name: VPN_TYPE
              value: {{ .Values.vpn.type | quote }}
            {{- if eq (lower .Values.vpn.type) "wireguard" }}
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vpn.secretName }}
                  key: WIREGUARD_PRIVATE_KEY
            {{- else }}
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vpn.secretName }}
                  key: OPENVPN_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vpn.secretName }}
                  key: OPENVPN_PASSWORD
            {{- end }}
            - name: FIREWALL
              value: {{ .Values.vpn.firewall | quote }}
            - name: FIREWALL_INPUT_PORTS
              value: {{ .Values.service.port | quote }}
            - name: SERVER_COUNTRIES
              value: {{ .Values.vpn.serverCountries | quote }}
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
        {{- end }}
        - name: searxng
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: INSTANCE_NAME
              value: {{ .Values.env.instanceName | quote }}
            - name: BASE_URL
              value: {{ .Values.env.baseUrl | quote }}
            - name: AUTOCOMPLETE
              value: {{ .Values.env.autocomplete | quote }}
            - name: SEARXNG_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: server-secret-key
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
      {{- if .Values.vpn.enabled }}
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      {{- end }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: searxng-nymvpn-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nymVpn.stateStorage.size }}
  storageClassName: {{ .Values.nymVpn.stateStorage.className }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: {{ .Values.namespace }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
      initContainers:
        - name: nymvpn-state-init
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          command: ["/bin/sh", "-c", "mkdir -p /nym/config /nym/state"]
          volumeMounts:
            - name: nymvpn-state
              mountPath: /nym
        - name: nymvpn
          image: {{ .Values.nymVpn.image | quote }}
          imagePullPolicy: {{ .Values.nymVpn.pullPolicy }}
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: NYMVPN_ENTRY_COUNTRY
              value: {{ .Values.nymVpn.entryCountry | quote }}
            - name: NYMVPN_EXIT_COUNTRY
              value: {{ .Values.nymVpn.exitCountry | quote }}
            - name: NYMVPN_POD_CIDR
              value: {{ .Values.nymVpn.podCidr | quote }}
          startupProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/local/bin/nymvpn-entrypoint", "startup"]
            failureThreshold: 3
            periodSeconds: 20
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: nymvpn-state
              mountPath: /etc/nym
              subPath: config
            - name: nymvpn-state
              mountPath: /var/lib/nym-vpnd
              subPath: state
            - name: nymvpn-access-code
              mountPath: /run/secrets/nymvpn
              readOnly: true
      containers:
        - name: searxng
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: INSTANCE_NAME
              value: {{ .Values.env.instanceName | quote }}
            - name: BASE_URL
              value: {{ .Values.env.baseUrl | quote }}
            - name: AUTOCOMPLETE
              value: {{ .Values.env.autocomplete | quote }}
            - name: SEARXNG_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: server-secret-key
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: nymvpn-state
          persistentVolumeClaim:
            claimName: searxng-nymvpn-pvc
        - name: nymvpn-access-code
          secret:
            secretName: {{ .Values.nymVpn.secretName }}
            defaultMode: 0400
            items:
              - key: NYM_ACCESS_CODE
                path: access-code

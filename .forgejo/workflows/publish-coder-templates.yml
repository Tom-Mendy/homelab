name: publish-coder-templates

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/coder/workspace-templates/**
      - scripts/publish-coder-templates.sh
      - .forgejo/workflows/publish-coder-templates.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-coder-templates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CODER_URL: https://coder.tom-mendy.com
      CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
      CODER_CLI_VERSION: 2.36.4
      COMMIT_SHA: ${{ github.sha }}
      EVENT_BEFORE: ${{ github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Install Coder CLI
        run: |
          curl -fsSL https://coder.com/install.sh \
            | sudo sh -s -- --version "$CODER_CLI_VERSION" --prefix /usr/local
          coder version

      - name: Publish changed templates
        run: ./scripts/publish-coder-templates.sh

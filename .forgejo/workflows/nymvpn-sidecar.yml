name: nymvpn-sidecar
# Build and publish through the rootless BuildKit runner.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - kubernetes/media/nymvpn/**
      - .forgejo/workflows/nymvpn-sidecar.yml

jobs:
  publish:
    runs-on: buildkit
    container:
      image: harbor.home.tom-mendy.com/homelab/ci/buildkit-forgejo@sha256:2974f53f0c1e4fa2486c7b6dd7aacb1bb76bfbda2735744e78143491c71b26e4
      credentials:
        username: ${{ secrets.HARBOR_REGISTRY_USER }}
        password: ${{ secrets.HARBOR_REGISTRY_TOKEN }}
    env:
      REGISTRY: harbor.home.tom-mendy.com
      IMAGE: harbor.home.tom-mendy.com/homelab/nymvpn-sidecar
      IMAGE_TAG: 2026.11.3-4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Configure Harbor authentication
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_TOKEN" | base64 | tr -d '\\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$auth" > "$HOME/.docker/config.json"
        env:
          HARBOR_USER: ${{ secrets.HARBOR_REGISTRY_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_REGISTRY_TOKEN }}

      - name: Build and publish image
        run: |
          set -euo pipefail
          buildctl-daemonless.sh build \
            --frontend dockerfile.v0 \
            --local context=kubernetes/media/nymvpn \
            --local dockerfile=kubernetes/media/nymvpn \
            --opt platform=linux/amd64 \
            --output type=image,name="$IMAGE:$FORGEJO_SHA",name="$IMAGE:$IMAGE_TAG",name="$IMAGE:latest",push=true \
            --import-cache type=registry,ref="$IMAGE:buildcache" \
            --export-cache type=registry,ref="$IMAGE:buildcache",mode=max

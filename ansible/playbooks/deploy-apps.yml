    - name: Load Vaultwarden manifest
      ansible.builtin.set_fact:
        vaultwarden_definitions: "{{ lookup('file', playbook_dir + '/../../kubernetes/vaultwarden/vaultwarden.yaml') | from_yaml_all }}"


- name: Deploy Kubernetes Applications
  hosts: kube_control_plane
  tasks:
    - name: Ensure kubernetes and yaml python libraries are installed (APT)
      become: true
      ansible.builtin.apt:
        name:
          - python3-kubernetes
          - python3-yaml
        state: present
        update_cache: true

    - name: Label node-3 for GPU
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Node
          metadata:
            name: node-3
            labels:
              gpu: "true"

    - name: Deploy MetalLB
      kubernetes.core.k8s:
        state: present
        src: https://raw.githubusercontent.com/metallb/metallb/main/config/manifests/metallb-native.yaml

    - name: Wait for MetalLB Controller to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: metallb-system
        label_selectors:
          - component=controller
      register: metallb_pods
      until: metallb_pods.resources | count > 0 and (metallb_pods.resources | map(attribute='status.phase') | unique | list == ['Running'])
      retries: 24
      delay: 5

    - name: Configure MetalLB (IP Pool and L2 advertisement)
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir + '/../../kubernetes/metallb/metallb-config.yaml') | from_yaml_all }}"

    - name: Add Traefik Helm repo
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: https://traefik.github.io/charts

    - name: Ensure Traefik namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: traefik

    - name: Apply Traefik Cloudflare DNS secret
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir + '/../../kubernetes/traefik/traefik-cloudflare-secret.example.yaml') | from_yaml }}"

    - name: Deploy Traefik Ingress Controller
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        release_namespace: traefik
        create_namespace: true
        values: "{{ lookup('file', playbook_dir + '/../../kubernetes/traefik/traefik-values.yaml') | from_yaml }}"

    - name: Ensure Blocky namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: blocky

    - name: Ensure Blocky config directory exists on control plane
      become: true
      ansible.builtin.file:
        path: /etc/blocky
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy Blocky config on control plane
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir + '/../../kubernetes/blocky/config.yml' }}"
        dest: /etc/blocky/config.yml
        owner: root
        group: root
        mode: '0644'

    - name: Read copied Blocky config
      become: true
      ansible.builtin.slurp:
        src: /etc/blocky/config.yml
      register: blocky_config_file

    - name: Ensure Blocky ConfigMap exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: blocky-config
            namespace: blocky
          data:
            config.yml: "{{ blocky_config_file.content | b64decode }}"

    - name: Deploy Blocky
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir + '/../../kubernetes/blocky/blocky.yaml') | from_yaml_all }}"

    - name: Ensure Homepage namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: homepage

    - name: Ensure Homepage config directory exists on control plane
      become: true
      ansible.builtin.file:
        path: /etc/homepage
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy Homepage services config on control plane
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir + '/../../kubernetes/homepage/services.yaml' }}"
        dest: /etc/homepage/services.yaml
        owner: root
        group: root
        mode: '0644'

    - name: Read copied Homepage services config
      become: true
      ansible.builtin.slurp:
        src: /etc/homepage/services.yaml
      register: homepage_services_file

    - name: Ensure Homepage services ConfigMap exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: homepage-config
            namespace: homepage
          data:
            services.yaml: "{{ homepage_services_file.content | b64decode }}"

    - name: Load Homepage manifest
      ansible.builtin.set_fact:
        homepage_definitions: "{{ lookup('file', playbook_dir + '/../../kubernetes/homepage/homepage.yaml') | from_yaml_all }}"

    - name: Deploy Homepage
      kubernetes.core.k8s:
        state: present
        definition: "{{ homepage_definitions }}"

    # - name: Deploy Trilium
    #   kubernetes.core.k8s:
    #     state: present
    #     definition: "{{ lookup('file', playbook_dir + '/../../kubernetes/trilium/trilium.yaml') | from_yaml_all }}"

    - name: Add Keel Helm repo
      kubernetes.core.helm_repository:
        name: keel
        repo_url: https://keel-hq.github.io/keel

    - name: Deploy Keel via Helm
      kubernetes.core.helm:
        name: keel
        chart_ref: keel/keel
        release_namespace: keel
        create_namespace: true
        values: "{{ lookup('file', playbook_dir + '/../../kubernetes/keel/keel-values.yaml') | from_yaml }}"

    - name: Apply Keel Ingress
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir + '/../../kubernetes/keel/keel-ingress.yaml') | from_yaml }}"

    - name: Add Prometheus Helm repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: Load Prometheus storage manifest
      ansible.builtin.set_fact:
        prometheus_storage_definitions: "{{ lookup('file', playbook_dir + '/../../kubernetes/prometheus/prometheus-storage.yaml') | from_yaml_all }}"

    - name: Apply Prometheus storage (NAS NFS)
      kubernetes.core.k8s:
        state: present
        definition: "{{ prometheus_storage_definitions }}"

    - name: Deploy Prometheus via Helm
      kubernetes.core.helm:
        name: prometheus
        chart_ref: prometheus-community/prometheus
        release_namespace: prometheus
        create_namespace: true
        values: "{{ lookup('file', playbook_dir + '/../../kubernetes/prometheus/prometheus-values.yaml') | from_yaml }}"

    - name: Apply Prometheus Ingress
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir + '/../../kubernetes/prometheus/prometheus-ingress.yaml') | from_yaml }}"


- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Upgrade system packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  become: true

- name: Set timezone
  community.general.timezone:
    name: Europe/Paris
  become: true

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - vim
      - htop
      - python3
      - python3-pip
      - unzip
      - wget
      - tree
      - nano
      - nfs-common
    state: present
    update_cache: true
  become: true

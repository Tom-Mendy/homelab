- name: Add Prometheus Helm repo
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Deploy Prometheus local Helm chart (storage + ingress)
  kubernetes.core.helm:
    name: prometheus-local-extras
    chart_ref: "{{ playbook_dir + '/../../kubernetes/prometheus' }}"
    release_namespace: prometheus
    create_namespace: true

- name: Deploy Prometheus via Helm
  kubernetes.core.helm:
    name: prometheus
    chart_ref: prometheus-community/prometheus
    release_namespace: prometheus
    create_namespace: true
    values: "{{ lookup('file', playbook_dir + '/../../kubernetes/prometheus/prometheus-values.yaml') | from_yaml }}"

- name: Ensure Argo CD repository secret exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-repo-homelab
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ argocd_gitops_repo_url }}"
        sshPrivateKey: "{{ argocd_gitops_repo_ssh_private_key }}"
        insecureIgnoreHostKey: "{{ argocd_gitops_repo_insecure_ignore_host_key | ternary('true', 'false') }}"
  when: argocd_gitops_repo_ssh_private_key | length > 0

- name: Warn if no SSH private key configured for Argo CD repository
  ansible.builtin.debug:
    msg: >-
      argocd_gitops_repo_ssh_private_key is empty. If {{ argocd_gitops_repo_url }}
      is private or requires SSH auth, Argo CD sync will fail until repository
      credentials are added.
  when:
    - argocd_gitops_repo_ssh_private_key | length == 0
    - argocd_gitops_repo_url is match('^(ssh://|git@)')

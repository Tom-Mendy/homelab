---
- name: Ensure target is Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
    fail_msg: "This Docker role currently supports Ubuntu only."
    success_msg: "Confirmed Ubuntu. Proceeding with Docker install."

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

# - name: Set docker_installed fact
#   ansible.builtin.set_fact:
#     docker_installed: "{{ docker_check.rc == 0 }}"

- name: Remove legacy Docker packages (if present)
  ansible.builtin.apt:
    name:
      - docker
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-plugin
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true
  become: true
  when: not docker_installed | default(false)

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  become: true
  when: not docker_installed | default(false)

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: not docker_installed | default(false)

- name: Download Docker's official GPG key (ASCII)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true
  when: not docker_installed | default(false)

- name: De-armor Docker GPG key to keyring
  ansible.builtin.command:
    cmd: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.gpg
  become: true
  when: not docker_installed | default(false)

- name: Ensure Docker keyring permissions are correct
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: '0644'
    state: file
  become: true
  when: not docker_installed | default(false)

- name: Detect dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_architecture
  changed_when: false
  become: true

- name: Remove legacy Docker apt source files in sources.list.d
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*docker*.list*'
    file_type: file
  register: docker_source_files
  become: true

- name: Delete legacy Docker apt source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_source_files.files }}"
  when: docker_source_files.matched | default(0) | int > 0
  become: true

- name: Ensure no Docker entries remain in /etc/apt/sources.list
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '^\s*deb .*download\.docker\.com/linux/ubuntu'
    state: absent
    backrefs: false
  become: true

- name: Remove ASCII Docker key to avoid Signed-By conflicts
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent
  become: true

- name: Add Docker apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ dpkg_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release | lower }} stable
    filename: docker
    state: present

- name: Install Docker Engine and related packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
  when: not docker_installed | default(false)

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

# Post-install steps from https://docs.docker.com/engine/install/linux-postinstall/
- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  become: true

- name: Add users to docker group (manage Docker as non-root)
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0
  become: true

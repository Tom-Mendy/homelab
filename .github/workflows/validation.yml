name: validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: detect --source . --redact --no-banner --verbose

      - name: Lint and render local Helm charts
        uses: docker://alpine/helm:3.18.3
        with:
          entrypoint: /bin/sh
          args: -ec './scripts/test-helm-chart.sh'

      - name: Render local charts for kubeconform
        uses: docker://alpine/helm:3.18.3
        with:
          entrypoint: /bin/sh
          args: -ec './scripts/render-local-charts-for-kubeconform.sh'

      - name: Validate rendered local charts
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -summary
            -ignore-missing-schemas
            .forgejo-rendered

      - name: Check Kubernetes storage policy
        run: ./scripts/check-storage-policy.sh

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check public documentation
        run: >-
          uvx --from rumdl==0.1.94 rumdl check README.md CONTRIBUTING.md SECURITY.md
          docs/architecture.md docs/portfolio-summary.md docs/publication.md

name: Kubernetes Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  helm:
    name: Helm Render And Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint and render local Helm charts
        run: ./kubernetes/test-helm-chart.sh

      - name: Install kubeconform
        run: |
          curl -sSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/kubeconform.tar.gz kubeconform
          kubeconform -v

      - name: Validate rendered local charts with kubeconform
        run: ./kubernetes/kubeconform-local-charts.sh

      - name: Check storage policy
        run: ./scripts/check-storage-policy.sh

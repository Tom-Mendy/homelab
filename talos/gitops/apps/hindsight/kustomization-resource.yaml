apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hindsight
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 10m
  path: ./talos/gitops/apps/hindsight
  prune: false
  wait: true
  serviceAccountName: talos-hindsight-reconciler
  sourceRef:
    kind: GitRepository
    name: talos-bootstrap

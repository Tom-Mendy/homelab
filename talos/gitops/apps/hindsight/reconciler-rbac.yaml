apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-hindsight-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-hindsight-reconciler
  namespace: agent
rules:
  - apiGroups: ["", "apps", "discovery.k8s.io", "networking.k8s.io", "helm.toolkit.fluxcd.io", "source.toolkit.fluxcd.io", "traefik.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-hindsight-reconciler
  namespace: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-hindsight-reconciler
subjects:
  - kind: ServiceAccount
    name: talos-hindsight-reconciler
    namespace: flux-system

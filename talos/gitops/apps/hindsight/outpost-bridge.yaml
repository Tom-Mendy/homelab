apiVersion: v1
kind: Service
metadata:
  name: hindsight-authentik-outpost
  namespace: agent
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hindsight-authentik-outpost-1
  namespace: agent
  labels:
    kubernetes.io/service-name: hindsight-authentik-outpost
    endpointslice.kubernetes.io/managed-by: talos-gitops
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.0.60
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hindsight-authentik-outpost
  namespace: agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: talos-traefik
  tls:
    - hosts:
        - hindsight.home.tom-mendy.com
      secretName: hindsight-tls
  rules:
    - host: hindsight.home.tom-mendy.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: hindsight-authentik-outpost
                port:
                  name: http

{
  "apiVersion": "helm.toolkit.fluxcd.io/v2",
  "kind": "HelmRelease",
  "metadata": {
    "name": "hindsight",
    "namespace": "agent"
  },
  "spec": {
    "interval": "5m",
    "timeout": "10m",
    "releaseName": "hindsight",
    "targetNamespace": "agent",
    "storageNamespace": "agent",
    "chart": {
      "spec": {
        "chart": "./talos/gitops/apps/hindsight/chart",
        "reconcileStrategy": "Revision",
        "sourceRef": {
          "kind": "GitRepository",
          "name": "talos-bootstrap",
          "namespace": "flux-system"
        }
      }
    },
    "install": {
      "createNamespace": false,
      "remediation": {
        "retries": 1
      }
    },
    "driftDetection": {
      "mode": "enabled"
    },
    "values": {
      "maintenance": {
        "enabled": false
      },
      "persistence": {
        "existingClaim": "hindsight-data"
      }
    }
  }
}

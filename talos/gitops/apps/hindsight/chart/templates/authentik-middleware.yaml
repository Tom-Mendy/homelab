apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-hindsight
  namespace: {{ .Values.namespace }}
spec:
  forwardAuth:
    address: {{ .Values.authentik.forwardAuthAddress | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid

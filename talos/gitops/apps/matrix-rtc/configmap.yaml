apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: matrix
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - ""
    rtc:
      tcp_port: 7881
      port_range_start: 50100
      port_range_end: 50110
      use_external_ip: false
      node_ip: "92.222.90.223"
      enable_loopback_candidate: false
    room:
      auto_create: false
    keys:
      __LIVEKIT_KEY__: __LIVEKIT_SECRET__

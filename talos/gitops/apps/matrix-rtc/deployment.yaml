apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-rtc
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-rtc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-rtc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-rtc
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              sed -e "s|__LIVEKIT_KEY__|${LIVEKIT_KEY}|g" \
                  -e "s|__LIVEKIT_SECRET__|${LIVEKIT_SECRET}|g" \
                  /config/livekit.yaml > /rendered/livekit.yaml
          env:
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: matrix-runtime
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrix-runtime
                  key: LIVEKIT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: rendered
              mountPath: /rendered
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/livekit/livekit.yaml"]
          ports:
            - {name: websocket, containerPort: 7880}
            - {name: rtc-tcp, containerPort: 7881}
            - {name: udp-50100, containerPort: 50100, protocol: UDP}
            - {name: udp-50101, containerPort: 50101, protocol: UDP}
            - {name: udp-50102, containerPort: 50102, protocol: UDP}
            - {name: udp-50103, containerPort: 50103, protocol: UDP}
            - {name: udp-50104, containerPort: 50104, protocol: UDP}
            - {name: udp-50105, containerPort: 50105, protocol: UDP}
            - {name: udp-50106, containerPort: 50106, protocol: UDP}
            - {name: udp-50107, containerPort: 50107, protocol: UDP}
            - {name: udp-50108, containerPort: 50108, protocol: UDP}
            - {name: udp-50109, containerPort: 50109, protocol: UDP}
            - {name: udp-50110, containerPort: 50110, protocol: UDP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: rendered
              mountPath: /etc/livekit
              readOnly: true
        - name: jwt
          image: ghcr.io/element-hq/lk-jwt-service:0.9.0@sha256:d210fd778ba38b7e42e6fc64e8a24a7d66ccc3b938fb20d73bd713224af2dfea
          imagePullPolicy: IfNotPresent
          env:
            - {name: LIVEKIT_JWT_BIND, value: ":8081"}
            - {name: LIVEKIT_URL, value: "wss://rtc.tom-mendy.com"}
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: matrix-runtime
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrix-runtime
                  key: LIVEKIT_SECRET
            - {name: LIVEKIT_FULL_ACCESS_HOMESERVERS, value: "matrix.tom-mendy.com"}
          ports:
            - {name: jwt, containerPort: 8081}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: jwt
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: livekit-config
        - name: rendered
          emptyDir: {}

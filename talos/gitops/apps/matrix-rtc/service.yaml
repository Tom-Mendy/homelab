apiVersion: v1
kind: Service
metadata:
  name: matrix-rtc-public
  namespace: matrix
spec:
  type: LoadBalancer
  loadBalancerIP: 10.0.0.74
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: matrix-rtc
  ports:
    - {name: websocket, port: 7880, targetPort: websocket, protocol: TCP}
    - {name: rtc-tcp, port: 7881, targetPort: rtc-tcp, protocol: TCP}
    - {name: jwt, port: 8081, targetPort: jwt, protocol: TCP}
    - {name: udp-50100, port: 50100, targetPort: udp-50100, protocol: UDP}
    - {name: udp-50101, port: 50101, targetPort: udp-50101, protocol: UDP}
    - {name: udp-50102, port: 50102, targetPort: udp-50102, protocol: UDP}
    - {name: udp-50103, port: 50103, targetPort: udp-50103, protocol: UDP}
    - {name: udp-50104, port: 50104, targetPort: udp-50104, protocol: UDP}
    - {name: udp-50105, port: 50105, targetPort: udp-50105, protocol: UDP}
    - {name: udp-50106, port: 50106, targetPort: udp-50106, protocol: UDP}
    - {name: udp-50107, port: 50107, targetPort: udp-50107, protocol: UDP}
    - {name: udp-50108, port: 50108, targetPort: udp-50108, protocol: UDP}
    - {name: udp-50109, port: 50109, targetPort: udp-50109, protocol: UDP}
    - {name: udp-50110, port: 50110, targetPort: udp-50110, protocol: UDP}

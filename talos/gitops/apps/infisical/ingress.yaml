apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infisical
  namespace: infisical
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: infisical-route-proof@kubernetescrd
spec:
  ingressClassName: talos-traefik
  rules:
    - host: infisical.home.tom-mendy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infisical-infisical-standalone-infisical
                port:
                  number: 8080

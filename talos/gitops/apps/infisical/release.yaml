apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: infisical
spec:
  interval: 30m
  timeout: 10m
  releaseName: infisical
  targetNamespace: infisical
  storageNamespace: infisical
  chart:
    spec:
      chart: infisical-standalone
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: infisical
  install:
    createNamespace: false
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    infisical:
      replicaCount: 0
      kubeSecretRef: infisical-secrets
      image:
        repository: infisical/infisical
        tag: v0.166.5@sha256:188b8ece6bb64e02852e948856010b45de93361a9d2974a9722c66efe94d2a35
        pullPolicy: IfNotPresent
      service:
        type: ClusterIP
      extraEnv:
        - name: ALLOW_INTERNAL_IP_CONNECTIONS
          value: "true"
    ingress:
      enabled: false
      nginx:
        enabled: false
    postgresql:
      enabled: false
      useExistingPostgresSecret:
        enabled: true
        existingConnectionStringSecret:
          name: infisical-postgres-app
          key: uri
    redis:
      enabled: true
      architecture: standalone
      image:
        registry: mirror.gcr.io
        repository: bitnamilegacy/redis
        digest: sha256:b7460c9b5a848e1c06111d267b2cfbe94d3272b246fe91c62e579fafdcc0560f
      usePassword: false
      auth:
        enabled: false
        password: ""
      master:
        persistence:
          enabled: true
          storageClass: ""
          size: 5Gi

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: job-search-manager-postgres
  namespace: job-search-manager
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  storage:
    size: 5Gi
    storageClass: nfs-k8s
  bootstrap:
    initdb:
      database: job_search_manager
      owner: job_search_manager

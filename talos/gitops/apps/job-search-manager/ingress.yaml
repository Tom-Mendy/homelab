apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-search-manager
  namespace: job-search-manager
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: job-search-manager-job-search-manager-route-proof@kubernetescrd,job-search-manager-authentik-job-search-manager@kubernetescrd
spec:
  ingressClassName: talos-traefik
  rules:
    - host: suivi-stage.home.tom-mendy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: job-search-manager
                port:
                  name: http

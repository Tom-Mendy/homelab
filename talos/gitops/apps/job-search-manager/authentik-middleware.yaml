apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-job-search-manager
  namespace: job-search-manager
spec:
  forwardAuth:
    address: https://authentik.tom-mendy.com/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid

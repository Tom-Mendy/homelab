apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  interval: 30m
  timeout: 10m
  releaseName: prometheus
  targetNamespace: prometheus
  storageNamespace: prometheus
  chart:
    spec:
      chart: prometheus
      version: 29.40.3
      sourceRef:
        kind: HelmRepository
        name: prometheus
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-values
      valuesKey: values.yaml
  install:
    createNamespace: false
  driftDetection:
    mode: enabled

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nfs-worker-probe
  namespace: prometheus
  labels:
    app.kubernetes.io/name: nfs-worker-probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nfs-worker-probe
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfs-worker-probe
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/library/python@sha256:8acac70227ce3b34da9453120c375cc5b66cd0b062d4dc6bc74286f81a3819e1
          imagePullPolicy: IfNotPresent
          command: [python3, -B, /app/nfs-probe.py]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - name: metrics
              containerPort: 9808
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: script
          configMap:
            name: nfs-worker-probe
            defaultMode: 0444
        - name: scratch
          persistentVolumeClaim:
            claimName: nfs-probe-scratch

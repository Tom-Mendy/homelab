apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus
resources:
  - pvc.yaml
  - repository.yaml
  - release.yaml
  - nfs-probe.yaml
  - ingress.yaml
  - ingress-secure.yaml
  - https-redirect.yaml
  - route-proof.yaml
configMapGenerator:
  - name: prometheus-values
    files:
      - values.yaml
  - name: nfs-worker-probe
    files:
      - nfs-probe.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    reconcile.fluxcd.io/watch: Enabled

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-postgres-backups
  namespace: authentik
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-k8s
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-postgres-backup
  namespace: authentik
spec:
  schedule: "15 2 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  umask 077
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  archive=$(mktemp /backups/.postgres.XXXXXX)
                  trap 'rm -f "$archive"' EXIT
                  pg_dump --no-password --format=custom --file="$archive"
                  pg_restore --list "$archive" > /dev/null
                  mv "$archive" "/backups/$BACKUP_NAME-$stamp.dump"
                  find /backups -maxdepth 1 -type f -name "$BACKUP_NAME-*.dump" -mtime +30 -delete
              env:
                - {name: BACKUP_NAME, value: authentik}
                - {name: PGHOST, value: authentik-postgres-rw}
                - {name: PGDATABASE, value: authentik}
                - {name: PGUSER, value: authentik}
                - {name: PGSSLMODE, value: require}
                - {name: PGCONNECT_TIMEOUT, value: "10"}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-postgres-app
                      key: password
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: "1", memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: authentik-postgres-backups

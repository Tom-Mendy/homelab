apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-postgres-backups-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-postgres-backups-reconciler
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-postgres-backups-reconciler
  namespace: coder
subjects:
  - kind: ServiceAccount
    name: talos-postgres-backups-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-postgres-backups-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-postgres-backups-reconciler
  namespace: forgejo
subjects:
  - kind: ServiceAccount
    name: talos-postgres-backups-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-postgres-backups-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-postgres-backups-reconciler
  namespace: infisical
subjects:
  - kind: ServiceAccount
    name: talos-postgres-backups-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-postgres-backups-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-postgres-backups-reconciler
  namespace: ollama
subjects:
  - kind: ServiceAccount
    name: talos-postgres-backups-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-postgres-backups-reconciler
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres-backups
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: talos-bootstrap
  path: ./talos/gitops/apps/postgres-backups
  serviceAccountName: talos-postgres-backups-reconciler
  prune: false
  wait: true

apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-portfolio-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-portfolio-reconciler
  namespace: portfolio
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-portfolio-reconciler
  namespace: portfolio
subjects:
  - kind: ServiceAccount
    name: talos-portfolio-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-portfolio-reconciler
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: portfolio
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: talos-bootstrap
  path: ./talos/gitops/apps/portfolio
  serviceAccountName: talos-portfolio-reconciler
  prune: false
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: portfolio
      namespace: portfolio

apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openwebui-postgres
  namespace: ollama
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  storage:
    size: 10Gi
    storageClass: nfs-k8s
  bootstrap:
    initdb:
      database: openwebui
      owner: openwebui
      encoding: UTF8
      localeCType: C
      localeCollate: C

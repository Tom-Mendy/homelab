# Apply to Ubuntu only. The existing Ingress resources retain public TLS.
apiVersion: v1
kind: Service
metadata:
  name: ollama-talos-bridge
  namespace: ollama
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-talos-bridge
  namespace: ollama
  labels:
    kubernetes.io/service-name: ollama-talos-bridge
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses: ["10.0.0.70"]
    conditions:
      ready: true

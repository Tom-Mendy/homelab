apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-authentik-backup-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-authentik-backup-reconciler
  namespace: authentik
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-authentik-backup-reconciler
  namespace: authentik
subjects:
  - kind: ServiceAccount
    name: talos-authentik-backup-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-authentik-backup-reconciler
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik-backup
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: talos-bootstrap
  path: ./talos/gitops/apps/authentik-backup
  serviceAccountName: talos-authentik-backup-reconciler
  prune: false
  wait: true

apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-arc-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: talos-arc-reconciler
rules:
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalconnections, infisicalauths, infisicalstaticsecrets]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-arc-reconciler
  namespace: arc-systems
subjects:
  - kind: ServiceAccount
    name: talos-arc-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-arc-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-arc-reconciler
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: talos-arc-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: talos-arc-reconciler
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arc-sumfeet
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: talos-bootstrap
  path: ./talos/gitops/apps/arc-sumfeet
  serviceAccountName: talos-arc-reconciler
  prune: false
  wait: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runners-infisical-sync
  namespace: arc-runners
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runners-infisical-token
  namespace: arc-runners
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [github-runners-infisical-sync]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runners-infisical-token
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    namespace: infisical-operator
    name: infisical-opera-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-runners-infisical-token
---
apiVersion: v1
kind: Secret
metadata:
  name: github-runners-infisical-identity
  namespace: arc-runners
type: Opaque
stringData:
  identityId: 7b887000-ae48-4603-8ed2-89a5bd6f1f5e

apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: talos-bootstrap
  namespace: flux-system
spec:
  interval: 5m
  timeout: 60s
  url: ssh://git@10.0.0.62/Tom-Mendy/homelab.git
  ref:
    branch: migration/talos-bootstrap-20261111
    commit: 9273724c467bf284440b9772b3c06f46e3804682
  secretRef:
    name: talos-forgejo-readonly
  ignore: |
    /*
    !/talos/
    /talos/*
    !/talos/gitops/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-bootstrap
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: talos-bootstrap
  path: ./talos/gitops/root
  serviceAccountName: talos-bootstrap-reconciler
  prune: false
  wait: true

apiVersion: v1
kind: Namespace
metadata:
  name: talos-gitops-validation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-bootstrap-reconciler
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-bootstrap-reconciler
  namespace: talos-gitops-validation
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-bootstrap-reconciler
  namespace: talos-gitops-validation
subjects:
  - kind: ServiceAccount
    name: talos-bootstrap-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-bootstrap-reconciler
